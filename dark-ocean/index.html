<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Ocean</title>
<meta name="description" content="The North Atlantic, 2020–2023, as sound and image. SuperCollider runs in this page.">
<style>
  html { background: #0b0f1e; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  iframe { border: 0; display: block; width: 100%; height: 100%; }
</style>
<script>
  // The style kit's look (the map's darkstyle.js keeps it in localStorage, or ?theme=): the shell's ground follows
  // it, so no dark frame shows around a light or paper map, and it follows a switch made inside the map.
  (function () {
    var bg = { dark: "#0b0f1e", light: "#e8ecf3", paper: "#f3e5da" }, look = null;
    try { look = new URLSearchParams(location.search).get("theme") || localStorage.getItem("darkstyle.theme"); } catch (e) {}
    var set = function (l) { document.documentElement.style.background = bg[l] || bg.dark; };
    set(look);
    addEventListener("storage", function (e) { if (e.key === "darkstyle.theme") set(e.newValue); });
  })();
</script>
</head>
<body>
<iframe id="view" title="Dark Ocean map"></iframe>
<script type="module">
  // Hosts that cannot send headers (GitHub Pages): a service worker adds the COOP/COEP headers that
  // SuperCollider's WebAssembly build needs. It covers this folder only: view/, engine/, sc/.
  let reloading = false;
  if (!self.crossOriginIsolated && "serviceWorker" in navigator) {
    await navigator.serviceWorker.register("./coi-sw.js");
    if (!sessionStorage.getItem("darkOceanCoi")) {        // first visit: reload once under the service worker
      sessionStorage.setItem("darkOceanCoi", "1");
      await navigator.serviceWorker.ready;
      reloading = true;
      location.reload();
    }
  } else {
    sessionStorage.removeItem("darkOceanCoi");
  }
  if (!reloading) {
    const { darkEngine } = await import("./engine.js");
    window.darkEngine = darkEngine;
    darkEngine.preload().catch(() => {});      // download + compile the class library now; sound starts at the first gesture
    const view = document.getElementById("view");
    view.addEventListener("load", () => { try { view.contentWindow.focus(); } catch (_) {} });   // keys (L, i, w, any key) reach the map at once
    view.src = "view/map.html" + (location.search || "?data=cube_time.json") + location.hash;
  }
</script>
</body>
</html>
