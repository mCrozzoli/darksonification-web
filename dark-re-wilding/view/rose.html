}
function renderMonthBar(){ if(_mbar) _mbar.render(); }
d3.select("#mb-all").on("click",()=>MonthBar.showAll());

// ---- focus panel + sound ----
function focusDraw(mo){
  const prev=lastFocus; lastFocus=mo; if(window.WC) WC.refresh();
  if(roseHours) loadHourMonth(mo);                      // P55: the month's hours, when it opens hour by hour
  if(prev!==mo) redrawCursor(prev, mo);            // the white cursor ring moved
  d3.select("#focus-title").text(isDay() && lastDay
    ? `${dayLabel(lastDay)}${(roseHours&&lastHour!=null)?" · "+pad2h(lastHour)+" UTC":""}${lastWin?" · "+lastWin:""}`
    : `${MONTHS[mo.month]} ${mo.year}${(roseHours&&lastHour!=null)?" · "+pad2h(lastHour)+" UTC":""}${lastWin?" · "+lastWin:""} · ${mo.ndays} days`);
  drawFocus(d3.select("#focus"), mo);
  const host=d3.select("#f-info"); host.selectAll("*").remove();
  if(isDay()){                                          // the day's value, beside its month's median day
    const rb=monthRibbon(mo), dr=lastDay&&dayRec(mo,lastDay);
    DIEL_CLOCK.forEach(w=>{ const v=dr&&dr[w]?dr[w][index]:null, r=rb[w];
      host.append("div").attr("class","row").style("color", w===lastWin?"var(--cur)":null)
        .style("opacity", dr&&dr[w]&&dr.nm ? (minFade(dr.nm[w])<1?0.6:null) : null)   // a thin window reads thin here too
        .html(`<span class="k">${w}</span><span class="v">${dr?(!dr[w]?"no window":v==null?"not measured":v.toFixed(2)):""} `
          // a heard day's row carries its own minutes; the month's day count gives way (one line in the
          // panel), and stays in the hover box of the month's ribbon
          + (dr&&dr[w]&&dr.nm&&dr.nm[w]!=null ? `<span class="k">${dr.nm[w]} min · </span>` : "")
          + `<span class="k">${r?`median ${r.med.toFixed(2)}${dr?"":` · ${r.n} days`}`:"no days"}</span></span>`); });
    if(roseHours) hoursInfo(host, mo);                  // P55
    if(window.WC && WC.faultNote && lastDay) host.append("div").html(WC.faultNote(lastDay));   // P52
    d3.select("#r-ret").text(retText(mo.returner));
    return;
  }
  DIEL_CLOCK.forEach(w=>{ const c=mo.win[w];
    const v=c? c.ax[index] : null;
    host.append("div").attr("class","row").style("color", w===lastWin?"var(--cur)":null)   // the window you are hearing
      .html(`<span class="k">${w}</span><span class="v">${v==null?"—":v.toFixed(2)} <span class="k">(n=${c?c.n:0})</span></span>`);
  });
  // what the focus rose's shading and line are (2026-10-01). Not a .row: the deck's screen checks read the rows.
  if(roseHours) hoursInfo(host, mo);                    // P55: the hours rose's own words
  else host.append("div").attr("class","k f-band").style("font-size","11px").style("margin-top","4px")
    .text("shaded: the middle half of the month's days · line: the month's average (a few extreme days can pull it outside the shading)");
  if(window.WC && WC.faultMonthNote) host.append("div").html(WC.faultMonthNote(mo.key));   // P52
  d3.select("#r-ret").text(retText(mo.returner));
}
// THE GROUPING. The grid's rows ARE years, so the row you are pressing in is the selection
// whose body the drone should be. Sent only on a change, or a drag across a row would
// re-voice the room on every cell it crossed.
const L0_YEARS=new Set([2023,2024,2025]);   // the year subsets the L0 tables ship — there is no year:2026
function sendSelection(yr){
  const subset = L0_YEARS.has(yr) ? `year:${yr}` : "all:2023-2026";
  if(subset===_subset || !(ws&&ws.readyState===1)) return;
  _subset=subset; ws.send(JSON.stringify({type:"select", level:0, subset}));
}
function focus(mo, win){
  // THE SONIFICATION FOLLOWS WHAT IS VISIBLE. There are no shadowed points here any more: a
  // rose you can see you can hear, and a month the filter has taken out of the view is not
  // there to be pressed. (The cells are inert while hidden; this guards the other ways in —
  // WC.step, a stale cursor — rather than voicing a month that is not on screen.)
  if(!mo || !isShownMo(mo)) return;
  lastHour=_hourPress; _hourPress=null;          // P55: an hour pressed on the hours rose, else none
  _sentTag=null;                                 // the last thing voiced is now this month, not a day
  lastWin = (win && mo.win[win]) ? win : null;   // a spoke with no recordings is not a point of its own
  // the calendar follows the cursor at EITHER resolution, so day mode opens on the month you hear
  if(calMonth!==mo || lastDay){ calMonth=mo; lastDay=null; if(isDay()) drawCalendar(); }
  focusDraw(mo);
  if(!(ws&&ws.readyState===1)) return;
  // LEVEL 0. `mkey` is an L0 key ("2023|8"); sent at level 1 the bridge looked it up in the
  // L1 table, where a month cannot exist, and the all-subset fallback missed too — which is
  // why this view has been silent since the v2 port. `win` then buys the rose its point: a
  // month key alone voices the same drone for all four spokes.
  const c = lastWin && mo.win[lastWin];
  const msg={type:"drv", level:0, drv:(c&&c.drv)||monthDrv(mo),
    mkey:`${mo.year}-${String(mo.month).padStart(2,"0")}`, channel};
  if(lastWin) msg.win=lastWin;
  ws.send(JSON.stringify(msg));
  // POINT FIRST, ROOM SECOND (TASKS P20, fixed here 2026-09-27): the bridge re-voices its last
  // point when the room changes, and a last point outside the new room fell back to `all` and
  // wrote that back - so room-then-point across a year left the new month in `all`.
  sendSelection(mo.year);
}

// ---- A: the CALENDAR of the focused month's days (day resolution) ----------------------
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pad2 = n => String(n).padStart(2,"0");
const dayKeyOf = (mo,d) => `${mo.year}-${pad2(mo.month)}-${pad2(d)}`;
const dayRec = (mo,dk) => mo.days.find(x=>x.d===+dk.slice(8));
function dayLabel(dk){ const [y,m,d]=dk.split("-").map(Number);
  return `${WD[new Date(Date.UTC(y,m-1,d)).getUTCDay()]} ${d} ${MONTHS[m]} ${y}`; }
// the months the calendar can step through: shown, with days, in time order
const calMonths = () => roses.filter(mo=>isShownMo(mo) && mo.days && mo.days.length).sort((a,b)=>a.key<b.key?-1:1);
function drawCalendar(){
  const wrap=document.getElementById("grid-wrap");
  wrap.classList.toggle("day", isDay());
  if(!isDay()) return;
  const ms=calMonths();
  if(!calMonth || !isShownMo(calMonth)) calMonth = lastFocus && isShownMo(lastFocus) ? lastFocus : ms[ms.length-1];
  const head=d3.select("#cal-head"), cal=d3.select("#cal"); head.selectAll("*").remove(); cal.selectAll("*").remove();
  if(!calMonth){ head.append("span").text("no month to show"); return; }
  const mo=calMonth, i=ms.indexOf(mo);
  if(roseHours) loadHourMonth(mo);                      // P55
  head.append("button").text("◀").attr("title","previous month").property("disabled",i<=0)
      .on("click",()=>{ if(ms[i-1]) focus(ms[i-1]); });
  head.append("b").text(`${MONTHS[mo.month]} ${mo.year}`);
  head.append("button").text("▶").attr("title","next month").property("disabled",i<0||i>=ms.length-1)
      .on("click",()=>{ if(ms[i+1]) focus(ms[i+1]); });
  const nThin=mo.days.reduce((a,d)=>a+DIEL_CLOCK.filter(w=>d[w] && d.nm && d.nm[w]!=null && d.nm[w]<MIN_THIN).length, 0);
  head.append("span").text((hoursOn(mo)
    ? `${mo.days.length} days recorded · each day's 24 hours (UTC) over the month's median hour (grey) · press an hour to hear its time of day`
    : `${mo.days.length} days recorded · each day over its month's median (grey) · press a day to hear it`)
    + (nThin ? ` · faint = under ${MIN_THIN} min recorded (${nThin} window${nThin>1?"s":""})` : ""));
  // Monday-first, UTC, rows sized to fit what is left of the pane
  const first=(new Date(Date.UTC(mo.year,mo.month-1,1)).getUTCDay()+6)%7;
  const nDays=new Date(Date.UTC(mo.year,mo.month,0)).getUTCDate();
  const nRows=Math.ceil((first+nDays)/7);
  cal.style("grid-template-rows",`14px repeat(${nRows}, minmax(0,1fr))`);
  ["M","T","W","T","F","S","S"].forEach(l=>cal.append("div").attr("class","dhd").text(l));
  for(let k=0;k<first;k++) cal.append("div");
  const rb=monthRibbon(mo), col=monthColor(mo.month);
  for(let d=1; d<=nDays; d++){
    const dk=dayKeyOf(mo,d), dr=dayRec(mo,dk);
    const cell=cal.append("div").attr("class","dcell"+(dr?"":" none"));
    const dn=cell.append("span").attr("class","dn").text(d);
    // P52: a PROBABLE RECORDER FAULT (findings/14) - the × right after the day's own number (its hover box names it)
    if(window.WC && WC.isFault && WC.isFault(dk)) dn.append("b").attr("class","wc-fault-dn").text(" \u00d7");
    const svg=cell.append("svg");
    cell.node().__dk=dk; cell.node().__svg=svg;
    if(dr){
      cell.on("pointerdown",function(e){
            if(WC.brushPref()||e.shiftKey||e.altKey){ traceArmed=WC.brushPref()||e.altKey;
              joinDayTrace(this,dk,true); return; }   // tracing, not hearing
            // a fresh press always sends: the dedupe is for repeats within ONE drag, and the engine
            // may have moved since (a month press, the legend, another view on the same bridge)
            window._roseDrag=true; _sentTag=null; focusDay(mo, dk, calWin(mo, dk, this.querySelector("svg"), e)); })
          .on("pointerover",function(e){ if(traceDrag){ joinDayTrace(this,dk); return; }
            if(window._roseDrag) focusDay(mo, dk, calWin(mo, dk, this.querySelector("svg"), e)); })
          .on("pointermove",function(e){
            // P55: in hours the pointer names an HOUR, and its window is that hour's own that day
            const w=calWin(mo, dk, this.querySelector("svg"), e), hp=_hourPress; _hourPress=null;
            // against the RESOLVED window (lastWin is what dayWinFor chose): over a spoke the day
            // lacks, the raw one never matches and every move redrew the whole calendar
            if(window._roseDrag && !traceDrag && (dk!==lastDay || dayWinFor(dk,w)!==lastWin || (hp!=null && hp!==lastHour))){
              _hourPress=hp; focusDay(mo, dk, w); }
            showDayTip(e, mo, dk, w, hp); })
          .on("pointerleave",()=>tip.hide());
    }
  }
  requestAnimationFrame(()=>redrawDays());
}
// only = the day keys to repaint (a press repaints the day it left and the day it lands on); omitted = all
function redrawDays(only){
  if(!isDay() || !calMonth) return;
  const mo=calMonth, rb=monthRibbon(mo), col=monthColor(mo.month);
  const HM=hoursOn(mo) ? hourMonth(mo) : null, HMS=HM ? hourStats(HM, index) : null;   // P55: hours mode
  // measure every cell FIRST, then draw: sizing one svg between reads forced a layout per cell
  const cells=d3.selectAll("#cal .dcell").nodes().filter(n=>n.__svg && (!only || only.includes(n.__dk)))
    .map(n=>({dk:n.__dk, svg:n.__svg, W:n.__svg.node().clientWidth, H:n.__svg.node().clientHeight}));
  cells.forEach(({dk, svg, W, H})=>{
    if(W<8||H<8) return;
    const cx=W/2, cy=H/2+2, RR=Math.max(4, Math.min(W,H)/2-7);
    svg.attr("width",W).attr("height",H).selectAll("*").remove();
    svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR).attr("fill","none")
       .attr("stroke","var(--line)").attr("stroke-width",0.6);
    const dr=dayRec(mo,dk); if(!dr) return;
    const hd=HM ? hourDay(HM, dk) : null;                // P55: this day's own 24 hours
    let p;
    if(hd){
      drawHourRef(svg, HMS, RR, cx, cy);                 // the month's median hour, grey
      const a=hd.v[index]||[];
      p=hourPts(h=>a[h], RR, cx, cy);
      drawDayHours(svg, hd, a, p, cx, cy, col, 0.22, 1.1, 0.9);
    } else {
    // the month's median day, grey: what this day is read against
    svg.append("path").attr("d",line(ptsOf(w=>rb[w]?rb[w].med:null,RR,cx,cy)))
       .attr("fill","none").attr("stroke","var(--dim)").attr("stroke-width",0.8).attr("opacity",0.7);
    p=ptsOf(w=> dr[w]? dr[w][index] : null, RR, cx, cy);
    drawDayRose(svg, dr, p, cx, cy, col, 0.22, 1.3);
    // a window this day did not record (or an index it did not measure) sits at the centre,
    // marked hollow - never drawn as quiet
    markGaps(svg, p, w=>dr[w] && dr[w][index]!=null);
    }
    if(dk===lastDay){
      svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR-1).attr("fill","none")
         .attr("stroke",RWLook.d.cursor).attr("stroke-width",1.2).attr("opacity",0.9);
      if(hd && lastHour!=null) svg.append("circle").attr("class","hr-cursor").attr("cx",p[lastHour][0]).attr("cy",p[lastHour][1])
         .attr("r",3.5).attr("fill","none").attr("stroke",RWLook.d.cursor).attr("stroke-width",1.2);
      else if(!hd && lastWin){ const i=DIEL_CLOCK.indexOf(lastWin);
        svg.append("circle").attr("cx",p[i][0]).attr("cy",p[i][1]).attr("r",4)
           .attr("fill","none").attr("stroke",RWLook.d.cursor).attr("stroke-width",1.2); }
    }
    if(window.WC && WC.isTraced("w:"+dk)){
      svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR+2).attr("fill","none")
         .attr("stroke",WC.GOLD).attr("stroke-width",4).attr("opacity",0.22);
      svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR).attr("fill","none")
         .attr("stroke",WC.traceColor("w:"+dk)||WC.GOLD).attr("stroke-width",1.8);
    } else if(window.WC && WC.isEcho && WC.isEcho("w:"+dk)){
      // ECHO: the same date as a traced day (or one of its windows), another year
      svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR).attr("fill","none")   // dark casing
         .attr("stroke",RWLook.d.casing).attr("stroke-width",3.2).attr("stroke-opacity",0.8);
      svg.append("circle").attr("class","wc-echo").attr("cx",cx).attr("cy",cy).attr("r",RR).attr("fill","none")
         .attr("stroke",WC.echoColor("w:"+dk)||WC.GOLD).attr("stroke-width",1.3)
         .attr("stroke-dasharray","3,2.5").attr("opacity",0.9);
    }
  });
}
// the day's own window nearest to `win` (itself, next, previous, opposite) that has an L1 point:
// a day can lack a window, and there is no whole-day point to stand in for it
function dayWinFor(dk, win){
  const has=w=>rowIdx[`${dk}:${w}`]!=null, i=DIEL_CLOCK.indexOf(win);
  if(has(win)) return win;
  const cand = i<0 ? DIEL_CLOCK : [1,3,2].map(k=>DIEL_CLOCK[(i+k)%4]);
  return cand.find(has) || null;
}
// HEAR A DAY: its window at L1, point first, room second (a room change re-voices the last
// point, and a point outside the new room falls back to `all` and writes that back).
function focusDay(mo, dk, win){
  if(!mo || !isShownMo(mo)) return;
  lastHour=_hourPress; _hourPress=null;          // P55
  const w=dayWinFor(dk, win);
  const prev=lastFocus, prevDay=lastDay, sameCal=calMonth===mo;
  lastDay=dk; lastWin=w; calMonth=mo;
  focusDraw(mo); if(prev!==mo) redrawCursor(prev, mo);
  if(sameCal) redrawDays([prevDay, dk]); else drawCalendar();   // the cursor moved between two days, not all 31
  if(!w || !(ws&&ws.readyState===1)) return;
  const tag=`${channel}|${dk}:${w}`; if(tag===_sentTag) return; _sentTag=tag;
  ws.send(JSON.stringify({type:"drv", level:1, widx:rowIdx[`${dk}:${w}`], channel}));
  ws.send(JSON.stringify({type:"select", level:1, subset:"year:"+dk.slice(0,4)}));
  _subset=null;                                   // the next month press re-asserts its L0 room
}
function joinDayTrace(node, dk, start){
  if(start) traceDrag=new Set();
  traceDrag.add("w:"+dk); node.classList.add("tracing");
}
// THE HOVER BOX (this view had none): the month or the day under the pointer, the window, the value
let tip=null;
function fmtv(v){ return v==null?"—":v.toFixed(2); }
function showCellTip(e, mo, w){
  if(!tip || !mo || !isShownMo(mo)) return;
  const col=monthColor(mo.month);
  if(isDay()){
    const r=monthRibbon(mo)[w];
    tip.show(e, `<div>${DIEL.dot(col)}<b>${MONTHS[mo.month]} ${mo.year}</b> · ${w}</div>`
      + (!r ? `<div class="k">no ${w} windows this month</div>`
         : `<div><span class="k">${index}</span>median ${fmtv(r.med)}</div>` + glossTip()
           + (r.n<THIN_N   // too few days for a middle half: say so, the faint band is not a steady one
              ? `<div class="k">${r.n===1?"one day, no spread":`only ${r.n} days, too few for a spread`}</div>`
              : `<div><span class="k">middle half</span>${fmtv(r.lo)}–${fmtv(r.hi)} · ${r.n} days</div>`))
      + (WC.traceNote ? WC.traceNote(mo.key) : "") + (WC.partialNote ? WC.partialNote(mo.key) : "")
      + (WC.faultMonthNote ? WC.faultMonthNote(mo.key) : ""));   // P52
  } else {
    const c=mo.win[w];
    tip.show(e, `<div>${DIEL.dot(col)}<b>${MONTHS[mo.month]} ${mo.year}</b> · ${w}</div>`
      + (c ? `<div><span class="k">${index}</span>${fmtv(c.ax[index])} <span class="k">mean of ${c.n} days</span></div>` + glossTip()
           : `<div class="k">no ${w} windows this month</div>`)
      + (WC.traceNote ? WC.traceNote(mo.key) : "") + (WC.partialNote ? WC.partialNote(mo.key) : "")
      + (WC.faultMonthNote ? WC.faultMonthNote(mo.key) : ""));   // P52
  }
}
function showDayTip(e, mo, dk, w, hp){
  if(!tip) return;
  if(hp!=null && hoursOn(mo)) return showDayHourTip(e, mo, dk, w, hp);   // P55: an hour of the day
  const dr=dayRec(mo,dk), r=monthRibbon(mo)[w], v=dr&&dr[w]?dr[w][index]:null, hw=dayWinFor(dk,w);
  tip.show(e, `<div>${DIEL.dot(monthColor(mo.month))}<b>${dayLabel(dk)}</b> · ${w}</div>`
    + (v!=null ? `<div><span class="k">${index}</span>${fmtv(v)}${r?` <span class="k">month median ${fmtv(r.med)}</span>`:""}</div>` + glossTip()
       // recorded but this index has no value (not a missing window: you hear the window itself)
       : dr&&dr[w] ? `<div class="k">${index} not measured in this window — you hear it all the same</div>` + glossTip()
               : `<div class="k">no ${w} window this day${hw?` — you hear its ${hw}`:""}</div>`)
    + (dr&&dr[w]&&dr.nm&&dr.nm[w]!=null ? `<div class="k">${minText(dr.nm[w])}</div>` : "")
    + (window.WC && WC.traceNote ? WC.traceNote("w:"+dk) : "")
    + (window.WC && WC.faultNote ? WC.faultNote(dk) : ""));   // P52
}

// ---- resolution toggle ----
function markRes(){ document.querySelectorAll("#res-toggle .wbtn").forEach(b=>b.classList.toggle("on", b.dataset.res===resolution)); }
function setResolution(r){
  if(r!=="day") r="month";
  if(r===resolution) return;
  const heardDay=lastDay;
  resolution=r; try{ localStorage.setItem("rewild_resolution", r); }catch(e){}
  if(window.WC && WC.setLevelDefaults) WC.setLevelDefaults(r);     // a no-op since P26: the bridge owns the mix
  if(!isDay()) lastDay=null;
  markRes(); buildGrid(); drawCalendar();
  // LEAVING THE CALENDAR WHILE A DAY SOUNDS: re-voice its month (L0 point, then room). Redrawn
  // alone, the panel would read the month's mean while the engine still played the one day at L1.
  if(heardDay && lastFocus) focus(lastFocus, lastWin);
  else if(lastFocus) focusDraw(lastFocus);
  if(window.LEG) LEG.refresh();
}
document.querySelectorAll("#res-toggle .wbtn").forEach(b=>b.addEventListener("click",()=>setResolution(b.dataset.res)));

// ---- index selector ----
// THE PICKED INDEX, IN PLAIN WORDS (2026-09-30). AEI and BI joined the list (the bridge's AX_COLS, in
// its order); each is explained wherever this view names it: the option's tooltip, the line under the
// picker, the hover box, the legend's key (legend.js GLOSS owns the words). AEI is drawn as measured:
// a longer spoke = more uneven. The picker only changes the picture - it sends nothing.
const glossOf = k => (window.LEG && LEG.gloss) ? LEG.gloss(k, channel) : null;
const glossTip = () => { const g=glossOf(index); return g ? `<div class="k">${g.slice(g.indexOf(" · ")+3)}</div>` : ""; };
function showGloss(){
  const g=glossOf(index), el=document.getElementById("index-gloss");
  d3.select("#index").attr("title", g);                 // null removes it
  if(el){ el.textContent=g||""; el.style.display=g?"block":"none"; }
  if(window.LEG && LEG.see) LEG.see();                  // the key's radius line; draws only
}
function buildIndexSelect(keys){
  // an index this channel never measured is not offered (n_species on water: BirdNET is air-only).
  // Every rose would sit on the floor - drawn as quiet, when it was never measured at all.
  const measured=k=>roses.some(mo=>DIEL_CLOCK.some(w=>mo.win[w] && mo.win[w].ax[k]!=null));
  keys=keys.filter(measured); if(!keys.length) keys=["ACI"];
  const sel=d3.select("#index");
  sel.selectAll("option").data(keys).join("option").attr("value",d=>d).text(d=>d).attr("title",d=>glossOf(d));
  sel.property("value", keys.includes("ACI")?"ACI":keys[0]); index=sel.property("value"); showGloss();
  sel.on("change",function(){ index=this.value; showGloss(); redrawCells(); redrawDays(); if(lastFocus) focusDraw(lastFocus); });
}

// ---- websocket ----
async function resolveWsPort(){
  const q=new URLSearchParams(location.search).get("ws"); if(q) return q;
  try{ const r=await Promise.reject(new Error("web build: no bridge")); const j=await r.json(); if(j&&j.ws) return String(j.ws);}catch(e){}
  return "8765";
}
function setConn(s,t){ const c=document.getElementById("chip"); c.className=s; c.textContent=t; }
async function connect(){
  const port=await resolveWsPort();
  ws=(window.__darkWeb ? window.__darkWeb.socket() : new WebSocket(`ws://127.0.0.1:${port}`));   // WEB BUILD (build_web.py)
  ws.onopen=()=>setConn("streaming","connected");
  ws.onclose=()=>{ setConn("disconnected","disconnected · retrying"); setTimeout(connect,1500); };
  ws.onerror=()=>ws.close();
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data);
    if(m.type==="mix"){ if(window.WC) WC.applyMix(m); return; }   // the bridge owns the mix; the faders render it
    if(m.type==="master"){ if(window.WC && WC.applyMaster) WC.applyMaster(m); return; }   // the master too (volume + mute): the bridge echoes it, the panel paints it
    if(m.type==="init"){
      window.RW_COVERAGE = m.coverage || {};           // per month: hours, windows, partial (bridge month_coverage)
      window.RW_FAULTS = m.faults || [];               // P52: probable recorder-fault days (findings/14); [] on air
      channel=m.channel||"air"; channels=m.channels||[];
      if(window.WC && WC.channelPref()!==channel && channels.includes(WC.channelPref())){
        ws.send(JSON.stringify({type:"channel",channel:WC.channelPref()})); return; }
      roses=m.roses||[]; byKey=new Map(roses.map(r=>[r.key,r]));
      // the L1 lookup for the calendar's sound: (date, window) -> the row the bridge plays.
      // Rebuilt on every init, because a channel switch swaps the rows (water's differ from air's).
      rowIdx={}; (m.rows||[]).forEach(r=>{ rowIdx[`${r.y}-${pad2(r.m)}-${pad2(r.d)}:${r.win}`]=r.idx; });
      _sentTag=null;
      l0months=m.l0months||[];                          // the legend's catalogue reads these
      years=[...new Set(roses.map(r=>r.year))].sort();
      _subset=null;                                     // a reconnect re-asserts the grouping on the next press
      setConn("streaming",`${channel} · ${roses.length} months · drag to hear`);
      if(window.WC && ws&&ws.readyState===1) ws.send(JSON.stringify({type:"loop",on:WC.loopPref()?1:0}));
      if(window.WC && ws&&ws.readyState===1) ws.send(JSON.stringify({type:"stat",stat:WC.statPref()}));
      if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:"mixquery"}));   // adopt the engine's mix, do not assume it
      if(!tip) tip=DIEL.tip(document.getElementById("grid-wrap"));
      if(!sideTip) sideTip=DIEL.tip(document.getElementById("side"));   // P55: the flag's hover box
      if(calMonth && !byKey.has(calMonth.key)) calMonth=null;
      if(calMonth) calMonth=byKey.get(calMonth.key);      // the same month in the new channel's data
      // THE CURSOR DOES NOT CROSS A CHANNEL SWITCH (nor a reconnect), as on the scatter
      // (index.html:724). Nothing is re-voiced here, so the engine is still on the last channel's
      // point - a ring on this channel's month or day would name one it is not playing, and the
      // day may not even exist here (water lacks 4 of air's days).
      clearFocus();
      buildIndexSelect(m.ax_keys||["ACI"]); markRes(); buildGrid(); mountMonthBar(); drawCalendar();
      lastHour=null; _hourPress=null; loadHourIndex(); markHours();   // P55: this channel's hours (flags first)
      if(!_wcInited){ _wcInited=true;
        WC.init({ container:document.getElementById("wc"), level:"l0",
          months:()=>roses.map(r=>r.key).sort(),
          // ◎ traces what is under the cursor: the DAY at day resolution, else the month
          current:()=> (isDay()&&lastDay) ? "w:"+lastDay : (lastFocus&&lastFocus.key), channel:()=>channel, channels:()=>channels,
          onChannel:ch=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:"channel",channel:ch})); },
          sound:()=>WC.soundPref(),
          onMaster:p=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:"master",...p})); },
          onMix:p=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:"mix",...p})); },
          onStat:s=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:"stat",stat:s}));
            if(window.LEG) LEG.refresh(); },      // the legend states which reading you are on
          onLoop:v=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:"loop",on:v})); },
          select:k=>{ const mo=byKey.get(k); if(!mo) return; reveal(k); focus(mo); },
          // ONE onChange for BOTH sets (wc.js fires it either way), so it has to answer both:
          // the shown filter decides which roses exist at all, the traces decide which carry a
          // ring. Repainting the whole grid answers the first; updateTraces + focusDraw the
          // second; syncFocus catches the cursor standing on a month you have just hidden.
          onChange:()=>{ syncFocus(); redrawCells(); renderMonthBar(); updateTraces(); drawCalendar();
            if(lastFocus) focusDraw(lastFocus); if(window.LEG) LEG.refresh(); } });
        WC.handleWebControl(m.web_control);
        // perceptual legend (C5 §19): the dockable panel the scatter had, now on every view
        LEG.init({
          send: obj => { if(ws&&ws.readyState===1) ws.send(JSON.stringify(obj)); },
          months: ()=>l0months, current: ()=>lastFocus&&lastFocus.key, channel: ()=>channel,
          index: ()=>index,                                // the SEE key names a glossed pick (AEI, BI)
          point: ()=> (isDay()&&lastDay&&lastWin) ? `w:${lastDay}:${lastWin}` : (lastFocus&&lastFocus.key),
          // A chip is "look at this record-holder", so o.show makes its month VISIBLE — it
          // does not trace it. The grid holds every month at once, so BRINGING it into view is
          // also scrolling to its cell and putting the cursor on it.
          select:(k,o)=>{ const mo=byKey.get(k); if(!mo) return;
            if(o&&o.show) reveal(k);
            focus(mo); revealCell(mo); },
          onToggle: ()=>{ if(roses.length){ buildGrid(); drawCalendar(); } } });   // the panel docks left; the grid reflows
        // the legend opens from its own left edge tab (legend.js) and the L key
      } else { WC.refresh(); if(window.LEG) LEG.refresh(); }   // channel re-init: data-only swap
    }
    if(m.type==="web_control"){ WC.handleWebControl(m); }
  };
}
window.addEventListener("resize",()=>{ if(roses.length){ buildGrid(); drawCalendar(); } });
// The focus rose is a clock too, and the only one drawn large enough to aim at: press or
// drag round it to walk the focused month's day without leaving the cell you are on.
// At day resolution with a day heard, it is THAT DAY's rose you walk (L1): the month is a press
// on the grid away, and dropping the day here would jump the sound back to L0.
d3.select("#focus")
  .on("pointerdown",function(e){ if(!lastFocus) return; window._roseDrag=true;
       if(hoursOn(lastFocus)) return pressHour(this, e, true);         // P55: an hour plays its window
       if(isDay() && lastDay){ _sentTag=null; focusDay(lastFocus, lastDay, winAt(this,e)); }
       else focus(lastFocus, winAt(this,e)); })
  .on("pointermove",function(e){ if(!lastFocus||!window._roseDrag) return;
       if(hoursOn(lastFocus)) return pressHour(this, e, false);        // P55
       const w=winAt(this,e);
       if(isDay() && lastDay){ if(dayWinFor(lastDay,w)!==lastWin) focusDay(lastFocus, lastDay, w); }   // resolved, as on the calendar
       else if(w!==lastWin) focus(lastFocus,w); });
// end a press-drag anywhere (sound is deliberate: press/drag over cells, not hover), and
// commit a trace-drag as ONE write rather than a toggle per cell it crossed
// THE BRUSH'S GRAMMAR, here too (review 2026-09-28): the header chip and the ◫ button promise
// "hold shift to untrace", and on the roses a trace-drag only ever ADDED. Now a drag armed by the
// BRUSH (the switch or alt) with shift held at release ERASES, as brush.js reads it; shift alone
// (brush off) is still this page's trace gesture and adds. A cancelled drag commits nothing.
d3.select(window).on("pointerup.rose pointercancel.rose",(e)=>{
  window._roseDrag=false;
  if(!traceDrag) return;
  const keys=[...traceDrag]; traceDrag=null;
  d3.selectAll("#grid .cell.tracing, #cal .dcell.tracing").classed("tracing",false);
  if(e && e.type==="pointercancel") return;
  WC.setTraced(keys, (traceArmed && e && e.shiftKey) ? "remove" : "add");
});
connect();
</script>
