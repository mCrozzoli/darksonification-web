<!DOCTYPE html>
<!-- dark_re_wilding · J3 — radial diel roses.
     One rose per month (rows = years, cols = months). Angle = time of day
     (night top · dawn right · day bottom · dusk left); radius = the selected
     index; the closed shape is that month's diel "fingerprint". Answers N6/N7
     (diel shape, not the mean) and N4-see (July-2023 vs July-2024 in one column).
     Press a rose -> hear it (sc/ engine); WHERE on it you press is the diel window
     you hear, so the four spokes are four points and not four copies of one.
     DAY resolution (2026-09-27, Miguel: "go with A and B"): every month becomes a RIBBON rose -
     the band is the middle half of its days (25th-75th percentile) at each time of day, the
     line its median day (B: many months, compared by shape AND steadiness) - and the focused
     month opens below as a CALENDAR of day roses (A: one month at a time; press a day to hear
     that day's window, at L1). At MONTH resolution the focused month shades the same middle half
     (2026-10-01, Miguel; it was the lowest to the highest day, which one storm day set), its bold
     line still the month's average. HOURS (P55, 2026-10-02, Miguel after Alice): the focused rose can
     open its month into 24 hours (UTC); the grid stays at four windows, and the sound stays with them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>dark_re_wilding · diel roses</title>
<link rel="stylesheet" href="darkstyle/darkstyle.css">
<script src="darkstyle/darkstyle.js"></script>   <!-- the style kit: dark · light · paper (projects/web/style) -->
<link rel="stylesheet" href="rewild_tokens.css">   <!-- this design's tokens: dark = the values below used to be literals -->
<script src="vendor/d3.v7.min.js"></script>
<script src="../web_bridge.js"></script>
<!-- web build: web_control.js (darkui GUI link) removed -->
<script src="looks.js"></script>   <!-- the looks' data colours (after d3, before the modules) -->
<script src="wc.js"></script>
<script src="panel.js"></script>
<script src="viewnav.js"></script>
<script src="monthbar.js"></script>
<script src="legend.js"></script>
<script src="diel.js"></script>
<style>
  :root{ --bg:var(--rw-bg); --panel:var(--rw-panel); --line:var(--rw-line); --txt:var(--rw-txt); --dim:var(--rw-dim); --cur:var(--rw-cur); }   /* rewild_tokens.css */
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:var(--ds-font-size)/1.45 var(--ds-font-ui); }
  #wrap{ display:grid; grid-template-rows:46px minmax(0,1fr); grid-template-columns:1fr 300px;
    height:100%; gap:1px; background:var(--line); }
  header{ grid-column:1/3; display:flex; align-items:center; gap:14px; padding:0 14px; background:var(--panel); }
  header b{ letter-spacing:.12em; }
  .ctl{ display:flex; align-items:center; gap:6px; } .ctl label{ color:var(--dim); }
  select,button{ background:var(--rw-ctl); color:var(--txt); border:1px solid var(--rw-ctl-line); border-radius:6px; padding:3px 8px; font:inherit; cursor:pointer; }
  button.on{ background:var(--rw-on); border-color:var(--rw-on-line); }
  #grid-wrap{ background:var(--bg); background-image:var(--ds-grain); overflow:auto; padding:8px 12px; display:flex; flex-direction:column; position:relative; }
  #grid-wrap > #grid{ flex:1 1 auto; }
  #grid-wrap.day > #grid{ flex:0 0 auto; }
  /* the DAY grid's rows are ~56 px: the cells must STRETCH to them, or the svg's height:100% has
     no definite height to resolve against and stays the 150 px default - a 150 px cell centred in a
     56 px row overlaps its neighbours, and the next year's box takes the presses (review 2026-09-27) */
  #grid-wrap.day .cell{ align-self:stretch; min-height:0; overflow:hidden; }
  #cal-wrap{ display:none; flex:1 1 auto; min-height:0; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  #grid-wrap.day #cal-wrap{ display:flex; flex-direction:column; }
  #cal-head{ display:flex; align-items:center; gap:10px; color:var(--dim); font-size:11px; margin-bottom:6px; }
  #cal-head b{ color:var(--txt); font-size:12px; letter-spacing:.06em; }
  #cal-head button{ padding:1px 8px; }
  #cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; flex:1 1 auto; min-height:0; }
  .dhd{ color:var(--dim); font-size:10px; text-align:center; }
  .dcell{ position:relative; min-height:0; }
  .dcell svg{ display:block; width:100%; height:100%; cursor:crosshair; }
  .dcell .dn{ position:absolute; left:3px; top:1px; font-size:10px; color:var(--dim); pointer-events:none; }
  .dcell .dn .wc-fault-dn{ color:var(--rw-fault); font-weight:700; text-shadow:0 0 2px var(--rw-casing),0 0 2px var(--rw-casing); }   /* P52 */
  .dcell.none{ opacity:.3; } .dcell.none svg{ cursor:default; }
  .dcell.tracing{ outline:1px dashed var(--rw-gold); outline-offset:-2px; }
  /* the ARMED trace-drag (the ◫ switch, or alt held) wears the brush tip (wc.js), not the
     crosshair every cell always has - on the SVG, which covers the cell and carries its own
     cursor (.cell svg{cursor:pointer}); !important, the month cells set theirs inline */
  body.brushing #grid .cell:not(.empty) svg, body.brush-alt #grid .cell:not(.empty) svg,
  body.brushing .dcell:not(.none) svg, body.brush-alt .dcell:not(.none) svg{ cursor:var(--rw-brush-cursor, cell) !important; }
  #grid{ display:grid; gap:2px; align-items:center; min-height:0; overflow:auto; }
  .hd{ color:var(--dim); font-size:10px; text-align:center; letter-spacing:.06em; }
  .yl{ color:var(--dim); font-size:11px; text-align:right; padding-right:6px; }
  .cell{ position:relative; }
  .cell svg{ display:block; width:100%; height:100%; cursor:pointer; }
  .cell.empty{ opacity:.16; }
  /* a month the filter is not showing: the ring and the typical-shape ghost stay, so the grid
     keeps its geometry and you can see WHERE the record you hid sits — but the rose is gone
     and the cell is inert, because what you cannot see you cannot hear. */
  .cell.hidden{ opacity:.13; pointer-events:none; }
  .cell.tracing{ outline:1px dashed var(--rw-gold); outline-offset:-2px; }   /* pending trace-drag, committed on release */
  /* the grid's axes ARE months and years, so its labels double as visibility shortcuts */
  .hd,.yl{ cursor:pointer; }
  .hd:hover,.yl:hover{ color:var(--txt); }
  .hd.sel,.yl.sel{ color:var(--cur); }
  #side{ background:var(--panel); padding:12px; overflow-y:auto; position:relative; }   /* P55: the flag's hover box sits in it */
  #hours-toggle{ margin:0 0 4px; } #hours-toggle .wbtn{ padding:3px 6px; }
  #focus{ width:100%; height:250px; cursor:crosshair; }
  #chip{ font-size:11px; padding:3px 9px; border-radius:11px; border:1px solid var(--rw-ctl-line); display:flex; align-items:center; gap:6px; }
  #chip::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--rw-chip-dot); }
  #chip.disconnected{ color:var(--rw-off); } #chip.disconnected::before{ background:var(--rw-off-dot); }
  #chip.streaming{ color:var(--rw-ok); } #chip.streaming::before{ background:var(--rw-ok-dot); }
  h4{ margin:8px 0 6px; color:var(--dim); font-size:11px; letter-spacing:.1em; }
  .row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:3px 0; }
  .k{ color:var(--dim); flex:0 0 auto; }
  .v{ flex:1 1 auto; min-width:0; text-align:right; overflow-wrap:anywhere; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <b><a href="../about.html" target="_blank" rel="noopener" title="about, credits and licences" style="color:inherit;text-decoration:none">dark_re_wilding ⓘ</a></b><span class="k">diel roses</span>
    <div id="chip" class="disconnected">disconnected</div>
    <span style="flex:1"></span>
    <nav id="viewnav"></nav>
  </header>

  <div id="grid-wrap"><div id="grid"></div>
    <div id="cal-wrap"><div id="cal-head"></div><div id="cal"></div></div>
  </div>

  <div id="side">
    <h4 id="focus-title">PRESS A MONTH</h4>
    <div id="traces" class="k" style="margin:2px 0 6px"></div>
    <!-- P55: the focused rose by its four times of day or its 24 hours (UTC); the grid stays at four -->
    <div class="wcgrid" id="hours-toggle" title="the focused rose: its four times of day, or its 24 hours (UTC) - the sound stays with the four">
      <button class="wbtn" data-hours="0">4 windows</button>
      <button class="wbtn" data-hours="1">24 hours</button>
    </div>
    <svg id="focus"></svg>
    <div id="f-info" style="margin-top:6px"></div>
    <div id="r-ret" style="margin-top:6px; color:var(--rw-dawn)"></div>
    <div class="wc-seglabel" style="color:var(--dim);font-size:11px;letter-spacing:.1em;margin:10px 0 6px">VIEW</div>
    <div class="wc-seglabel" style="color:var(--dim);font-size:11px;letter-spacing:.1em;margin:4px 0 6px">RESOLUTION</div>
    <div class="wcgrid" id="res-toggle" style="margin-bottom:8px">
      <button class="wbtn" data-res="month" title="one rose per month: its mean day">month</button>
      <button class="wbtn" data-res="day" title="ribbon roses of each month's days, and a calendar of the focused month">day</button>
    </div>
    <!-- WHAT YOU SEE. The shared strip writes the SHOWN set and nothing else: no ring, no
         aura, no trace. Tracing is the other act entirely, over in the CONTROLLER tab. -->
    <div id="monthbar" style="margin:2px 0 5px"></div>
    <button class="wbtn" id="mb-all" style="width:100%" title="show every month again">↺ all</button>
    <div class="k" style="font-size:10px;margin:5px 0 8px;line-height:1.4">
      the grid's own <b>Jan…Dec</b> headers and <b>year</b> labels show or hide a whole column / row
    </div>
    <label class="k" style="font-size:11px">index (radius)</label>
    <select id="index" style="width:100%;margin:4px 0 2px"></select>
    <!-- the picked index in plain words (AEI, BI: legend.js GLOSS); hidden, and taking no room, otherwise -->
    <div id="index-gloss" class="k" style="display:none;font-size:10px;line-height:1.4;margin:3px 0 4px"></div>
    <div id="wc"></div>
  </div>
</div>

<script>
const DIEL_CLOCK = ["night","dawn","day","dusk"];   // clockwise from top
const ANG = {night:0, dawn:Math.PI/2, day:Math.PI, dusk:3*Math.PI/2};
const MONTHS = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthColor = m => d3.interpolateSinebow(((m-1)%12)/12);
const rad = v => 0.12 + 0.88*Math.max(0,Math.min(1,v==null?0:v));   // value -> unit radius
const retText = r => !r ? "" : (r.kind==="return"
  ? `↩ returner: ${r.common} · back ${r.gap}mo` : `↩ ${r.common} · first record`);

let roses=[], byKey=new Map(), index="ACI", years=[], ws=null, lastFocus=null, lastWin=null;
let l0months=[], channel="air", channels=[], _wcInited=false;   // air/water switch
let traceDrag=null, _subset=null, _mbar=null;   // pending trace set · the grouping last sent · the month strip
let traceArmed=false;   // this trace-drag was armed by the BRUSH (the ◫ switch or alt), not by shift alone
// DAY RESOLUTION (2026-09-27). Shared with the scatter and the biplot ("rewild_resolution"), so
// "day" means day on every dot/rose view. lastDay = the day being heard ("YYYY-MM-DD");
// calMonth = the month the calendar shows; rowIdx = (date, window) -> the L1 row the bridge plays.
let resolution = (()=>{ try{ return localStorage.getItem("rewild_resolution")==="day" ? "day" : "month"; }catch(e){ return "month"; } })();
let lastDay=null, calMonth=null, rowIdx={}, _sentTag=null;
const isDay = () => resolution==="day";
// TWO INDEPENDENT SETS, and this view holds them apart as strictly as the point-field views do.
//   SHOWN  (WC.isShown / the month strip / the grid's own axis labels) = which roses are drawn.
//          Visibility only: no ring, no aura, and an empty filter means the whole record.
//   TRACED (WC.isTraced / shift- or ◫-drag across cells / ◎) = the ring + aura on a rose you
//          are keeping an eye on. It dims nothing and hides nothing.
// A traced month you have hidden is not lost: its cell simply has no rose until you show the
// month again, and the ring comes back with it.
const isShownMo = mo => !!mo && (!window.WC || WC.isShown(mo.key));

// ---- geometry ----
const line = d3.line().curve(d3.curveLinearClosed);
// valFn(w) -> 0..1  =>  4 polygon points around the clock
function ptsOf(valFn, RR, cx, cy){
  return DIEL_CLOCK.map(w=>{ const r=rad(valFn(w))*RR, a=ANG[w];
    return [cx + r*Math.sin(a), cy - r*Math.cos(a)]; });
}
const winMean = (mo,w) => (mo && mo.win[w]) ? mo.win[w].ax[index] : null;   // month mean, selected index
// A SPOKE WITH NO VALUE IS MARKED HOLLOW. rad(null) is the floor, the same radius as a real 0, so
// unmarked a window that was never recorded (or an index never measured) reads as a quiet one
// (DISPLAY_DESIGN §6.2). pts = the rose's four vertices, has(w) = "this spoke has a value".
function markGaps(svg, pts, has, r){
  DIEL_CLOCK.forEach((w,i)=>{ if(!has(w)) svg.append("circle").attr("cx",pts[i][0]).attr("cy",pts[i][1])
     .attr("r",r||2.2).attr("fill","var(--bg)").attr("stroke","var(--dim)").attr("stroke-width",0.8); });
}
// WHICH SPOKE THE POINTER IS ON. A rose is a clock, so the angle from its centre already IS
// a time of day — no hit targets needed, and the four spokes are exactly 90° apart. This is
// what lets the view name its diel window when it navigates (see focus()).
function winAt(node, e){
  const b=node.getBoundingClientRect();
  const t=Math.atan2(e.clientX-(b.left+b.width/2), (b.top+b.height/2)-e.clientY);   // clockwise from north, as ANG is
  return DIEL_CLOCK[(Math.round(t/(Math.PI/2))+4)%4];
}

// typical diel shape = mean across ALL months (per window, selected index). Deliberately NOT
// filtered by what is shown: it is the whole record's baseline, and a reference that moved
// every time you hid a month would make two filters incomparable.
function grandMean(){
  const acc={}, n={}; DIEL_CLOCK.forEach(w=>{ acc[w]=0; n[w]=0; });
  roses.forEach(mo=>DIEL_CLOCK.forEach(w=>{ const v=winMean(mo,w); if(v!=null){ acc[w]+=v; n[w]++; } }));
  const gm={}; DIEL_CLOCK.forEach(w=> gm[w]= n[w]? acc[w]/n[w] : 0); return gm;
}
// THE MONTH'S DAY RANGE (its lowest and highest day) per window. NOT DRAWN since 2026-10-01: the focused
// rose shades the middle half of the days (monthRibbon), as the day ribbons do. Kept because the deck's screen
// checks call it in the page (docs/alice_feedback/deck/render/screens_q1.py, screens_q1b.py: the day range).
function monthBand(mo){
  const b={}; DIEL_CLOCK.forEach(w=>{
    const vs=mo.days.map(d=> d[w]? d[w][index] : null).filter(v=>v!=null);
    b[w]= vs.length ? [Math.min(...vs), Math.max(...vs)] : null; });
  return b;
}

// THE RIBBON (day resolution): per window, the MIDDLE HALF of the month's days (25th-75th
// percentile) and the median day. Not min-max: one storm day would set a month's whole band.
// Its middle half is also the focused month's band at MONTH resolution (drawFocus, 2026-10-01).
function quant(sorted, p){
  if(!sorted.length) return null;
  const i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
  return sorted[lo] + (sorted[hi]-sorted[lo])*(i-lo);
}
function monthRibbon(mo){
  const r={}; DIEL_CLOCK.forEach(w=>{
    const vs=mo.days.map(d=> d[w]? d[w][index] : null).filter(v=>v!=null).sort((a,b)=>a-b);
    r[w]= vs.length ? {lo:quant(vs,0.25), med:quant(vs,0.5), hi:quant(vs,0.75), n:vs.length} : null; });
  return r;
}
// draw a ribbon rose: the band (the region between the 75th and 25th percentile shapes) + the median line.
// THIN SUPPORT FADES (§6.2): a spoke with fewer than THIN_N days has no middle half to speak of - one
// day draws a band of zero width, which is exactly what a perfectly steady month looks like - so the
// band and the median either side of it are drawn faint, and a spoke with no days at all is marked
// hollow. That is why the band is four wedges (one per quarter of the clock) and not one path.
const THIN_N=4, THIN_FADE=0.3;
function drawRibbon(svg, mo, RR, cx, cy, col, opts){
  const rb=monthRibbon(mo), o=opts||{};
  const at=(w,k)=> rb[w] ? rb[w][k] : null;
  const outer=ptsOf(w=>at(w,"hi"),RR,cx,cy), inner=ptsOf(w=>at(w,"lo"),RR,cx,cy), med=ptsOf(w=>at(w,"med"),RR,cx,cy);
  const bo=o.bandOpacity==null?0.28:o.bandOpacity, lo=o.opacity==null?1:o.opacity;
  const thin=i=>{ const r=rb[DIEL_CLOCK[i]]; return !r || r.n<THIN_N; };
  DIEL_CLOCK.forEach((w,i)=>{ const j=(i+1)%4, f=(thin(i)||thin(j))?THIN_FADE:1;
    svg.append("path").attr("d",`M${outer[i]}L${outer[j]}L${inner[j]}L${inner[i]}Z`)
       .attr("fill",col).attr("fill-opacity",bo*f).attr("stroke","none");
    svg.append("path").attr("d",`M${med[i]}L${med[j]}`).attr("fill","none")
       .attr("stroke",col).attr("stroke-width",o.width||1.4).attr("stroke-linecap","round")
       .attr("stroke-dasharray",o.dash||null).attr("opacity",lo*f);
  });
  markGaps(svg, med, w=>!!rb[w], o.gapR);
  return rb;
}

// ONE DAY'S ROSE, FADED BY ITS RECORDED MINUTES (TASKS P33). A day-window's value is a mean
// over the minutes it holds, so what makes it trustworthy is how many there are - not how long
// the window is: the same rule as spectro/mfcc's DAY cells (under 30 min faded, 5 or fewer
// fainter). dr.nm = {window: minutes}. A day with every window well recorded (97% of them) is
// one path; otherwise four wedges, faded like drawRibbon's quarters, so only the thin part pales.
const MIN_THIN=30, MIN_FAINT=5;
const minFade = n => n==null ? 1 : n<=MIN_FAINT ? 0.22 : n<MIN_THIN ? 0.5 : 1;   // hourview.js's DAY values
function drawDayRose(svg, dr, p, cx, cy, col, fillOp, width){
  const nm=dr.nm||{}, f=DIEL_CLOCK.map(w=> dr[w] ? minFade(nm[w]) : 1);
  if(f.every(x=>x===1)){
    svg.append("path").attr("d",line(p)).attr("fill",col).attr("fill-opacity",fillOp)
       .attr("stroke",col).attr("stroke-width",width);
    return;
  }
  DIEL_CLOCK.forEach((w,i)=>{ const j=(i+1)%4, k=Math.min(f[i],f[j]);
    svg.append("path").attr("d",`M${cx},${cy}L${p[i]}L${p[j]}Z`).attr("fill",col)
       .attr("fill-opacity",fillOp*k).attr("stroke","none");
    svg.append("path").attr("d",`M${p[i]}L${p[j]}`).attr("fill","none").attr("stroke",col)
       .attr("stroke-width",width).attr("stroke-linecap","round").attr("opacity",k); });
}
const minText = n => n==null ? "" : `${n} min recorded${n<MIN_THIN?" — thin, read with care":""}`;

// ---- grid cell: reference ring + faint grand-mean ghost + mean rose ----
function drawCell(svg, mo, gm){
  const node=svg.node(), W=node.clientWidth, H=node.clientHeight, cx=W/2, cy=H/2, RR=Math.min(W,H)/2-6;
  svg.attr("width",W).attr("height",H).selectAll("*").remove();
  svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR)
     .attr("fill","none").attr("stroke","var(--line)").attr("stroke-width",0.6);
  svg.append("path").attr("d",line(ptsOf(w=>gm[w],RR,cx,cy)))   // typical-shape ghost
     .attr("fill","none").attr("stroke","var(--dim)").attr("stroke-width",0.6).attr("opacity",0.35);
  // NOT SHOWN -> no rose. The ring and the ghost above stay so the grid keeps its shape, but
  // the month is out of the view: nothing to read, nothing to press, nothing to hear.
  if(!mo || !isShownMo(mo)) return;
  const col=monthColor(mo.month);
  if(isDay()) drawRibbon(svg, mo, RR, cx, cy, col);            // B: the month's days, as a band
  else {
    const p=ptsOf(w=>winMean(mo,w),RR,cx,cy);
    svg.append("path").attr("d",line(p)).attr("fill",col).attr("fill-opacity",0.14)
       .attr("stroke",col).attr("stroke-width",1.5);
    markGaps(svg, p, w=>winMean(mo,w)!=null);
  }
  if(lastFocus===mo) svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR-1)
     .attr("fill","none").attr("stroke",RWLook.d.cursor).attr("stroke-width",1.2).attr("opacity",0.9);   // cursor: where the sound is
  // TRACED: the aura and the ring, and only for traces. Being SHOWN earns a rose, never a
  // circle — the shiny ring round a month you had merely selected to look at is exactly what
  // Miguel reported. The aura is the shared gold glow; the ring inside it is this trace's own
  // colour, so several traces are told apart rather than all being one gold.
  if(window.WC && WC.isTraced(mo.key)){
    svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR+3)       // aura
       .attr("fill","none").attr("stroke",WC.GOLD).attr("stroke-width",5).attr("opacity",0.22);
    svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR+1)       // ring
       .attr("fill","none").attr("stroke",WC.traceColor(mo.key)||WC.GOLD).attr("stroke-width",2);
  }
  if(window.WC && WC.isPartial && WC.isPartial(mo.key)){
    // a PARTIAL month (a time of day missing, or thin): the half-filled badge, top left
    svg.append("circle").attr("class","wc-partial").attr("cx",cx-RR+3).attr("cy",cy-RR+3).attr("r",3.4)
       .attr("fill",WC.halfFill(RWLook.d.partial)).attr("stroke",RWLook.d.partial).attr("stroke-width",0.9);
  }
  if(window.WC && WC.isTraced(mo.key)){ /* ringed above */ }
  else if(window.WC && WC.isEchoMonth && WC.isEchoMonth(mo.key)){
    // ECHO: the same month as a trace, another year (wc.js ECHOES) - dashed, no aura, in the
    // colour of the trace it answers to. Down a calendar column, a traced May marks every May.
    svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",RR+1).attr("fill","none")   // dark casing
       .attr("stroke",RWLook.d.casing).attr("stroke-width",3.4).attr("stroke-opacity",0.8);
    svg.append("circle").attr("class","wc-echo").attr("cx",cx).attr("cy",cy).attr("r",RR+1)
       .attr("fill","none").attr("stroke",WC.echoColor(mo.key)||WC.GOLD).attr("stroke-width",1.4)
       .attr("stroke-dasharray","3,2.5").attr("opacity",0.9);
  }
}

// THE SAME MONTH IN THE OTHER YEARS (Miguel 2026-09-28: "When traced"). When the month in focus is
// traced, or is an echo of a trace, the focus rose also draws that calendar month in every other
// year - dashed, in the month's colour, older years fainter (the lightness ramp) - so a traced May
// shows every May's diel shape on one rose: Alice's "did it change?" as one picture. Months the
// filter hides are skipped; the ◌ echo switch turns it off with the echoes.
function sameMonthYears(mo){
  if(!mo || !window.WC || !WC.echoPref || !WC.echoPref()) return null;
  if(!(WC.isTraced(mo.key) || (WC.isEchoMonth && WC.isEchoMonth(mo.key)))) return null;
  const all=roses.filter(o=>o.month===mo.month && (o===mo || isShownMo(o))).sort((a,b)=>a.year-b.year);
  if(all.length<2) return null;
  const n=all.length, op=o=>0.3+0.7*(all.indexOf(o)/(n-1));
  return { others: all.filter(o=>o!==mo), all, op };
}
// the key, bottom left (clear of the spoke labels): one year per line, newest at the bottom
function drawYearKey(svg, ys, mo, W, H){
  const g=svg.append("g").attr("class","wc-years");
  ys.all.forEach((o,i)=>g.append("text").attr("x",4).attr("y",H-6-12*(ys.all.length-1-i)).attr("font-size",10)
     .attr("fill",monthColor(o.month)).attr("opacity",ys.op(o)).attr("font-weight",o===mo?"bold":null)
     .text(`${o===mo?"\u2501":"\u2504"} ${o.year}`));
}

// ---- focus: grand mean (dashed) + the middle half of the month's days (shaded) + mean + the traced months ----
function drawFocus(svg, mo){
  const node=svg.node(), W=node.clientWidth, H=node.clientHeight, cx=W/2, cy=H/2, RR=Math.min(W,H)/2-28;
  svg.attr("width",W).attr("height",H).selectAll("*").remove();
  [0.5,1.0].forEach(f=>svg.append("circle").attr("cx",cx).attr("cy",cy)
    .attr("r",(0.12+0.88*f)*RR).attr("fill","none").attr("stroke","var(--line)").attr("stroke-width",0.6));
  if(mo && hoursOn(mo)) return drawFocusHours(svg, mo, hourMonth(mo), RR, cx, cy);   // P55: the month hour by hour
  const gm=grandMean();
  svg.append("path").attr("d",line(ptsOf(w=>gm[w],RR,cx,cy)))   // typical shape, dashed grey
     .attr("fill","none").attr("stroke","var(--dim)").attr("stroke-width",1).attr("stroke-dasharray","2,3");
  if(!mo) return;
  if(isDay()) return drawFocusDay(svg, mo, RR, cx, cy);
  const col=monthColor(mo.month), rb=monthRibbon(mo);
  // THE BAND: the MIDDLE HALF of the month's days (25th-75th percentile) at each time of day, as the day
  // ribbons draw it (Miguel, 2026-10-01; it was the lowest to the highest day, which one storm day set).
  // Thin support as on the ribbon: a quarter of the clock touching a spoke with fewer than THIN_N days is
  // faint, and a spoke with no days keeps the month's mean (no width) and its hollow mark below. Four
  // wedges, not one path, so only the thin quarters fade. The bold line below stays the month's AVERAGE, unfilled.
  // Opacity 0.3, the day focus's own (2026-10-01): at 0.14 the band sat 4.4-6.1 OKLab dE off the panel's ground in
  // the three looks, under the style kit's 7 for a fill that reads.
  const at=(w,k)=> rb[w] ? rb[w][k] : winMean(mo,w);
  const outer=ptsOf(w=>at(w,"hi"), RR, cx, cy), inner=ptsOf(w=>at(w,"lo"), RR, cx, cy);
  const thin=i=>{ const r=rb[DIEL_CLOCK[i]]; return !r || r.n<THIN_N; };
  const gb=svg.append("g").attr("class","focus-band");
  DIEL_CLOCK.forEach((w,i)=>{ const j=(i+1)%4, f=(thin(i)||thin(j))?THIN_FADE:1;
    gb.append("path").attr("d",`M${outer[i]}L${outer[j]}L${inner[j]}L${inner[i]}Z`).attr("data-w",w)
      .attr("fill",col).attr("fill-opacity",0.3*f).attr("stroke","none"); });
  // every OTHER TRACED month, dashed in its trace colour. Tracing is "keep an eye on this",
  // so the traced roses are the ones worth superimposing on the one you are hearing — and a
  // trace whose month you have hidden is skipped, not drawn from behind the filter.
  const ys=sameMonthYears(mo);
  ((window.WC&&WC.tracedMonths)?WC.tracedMonths():new Set()).forEach(k=>{
    const o=byKey.get(k); if(!o||o===mo||!isShownMo(o)) return;
    if(ys && ys.others.includes(o)) return;                // drawn below, as one of the years
    svg.append("path").attr("d",line(ptsOf(w=>winMean(o,w),RR,cx,cy)))
       .attr("fill","none").attr("stroke",WC.traceColor(k)||monthColor(o.month)).attr("stroke-width",1.6)
       .attr("stroke-dasharray","5,3").attr("opacity",0.9);
  });
  if(ys){ ys.others.forEach(o=>svg.append("path").attr("class","wc-year-rose").attr("data-mk",o.key)
       .attr("d",line(ptsOf(w=>winMean(o,w),RR,cx,cy))).attr("fill","none").attr("stroke",monthColor(o.month))
       .attr("stroke-width",1.5).attr("stroke-dasharray","4,3").attr("opacity",ys.op(o)));
    drawYearKey(svg, ys, mo, W, H); }
  // this month's mean (bold): a LINE with no fill (Miguel, 2026-10-01), so the middle-half band is never hidden
  // under it - a few extreme days can pull the average outside the band, and the band must still show there
  const p=ptsOf(w=>winMean(mo,w),RR,cx,cy);
  svg.append("path").attr("d",line(p)).attr("fill","none")
     .attr("stroke",col).attr("stroke-width",2);
  svg.selectAll("circle.vtx").data(DIEL_CLOCK).join("circle").attr("class","vtx")
     .attr("cx",(w,i)=>p[i][0]).attr("cy",(w,i)=>p[i][1]).attr("r",3).attr("fill",col);
  markGaps(svg, p, w=>winMean(mo,w)!=null, 3.5);
  if(lastWin){ const i=DIEL_CLOCK.indexOf(lastWin);   // which spoke the sound is standing on
    svg.append("circle").attr("cx",p[i][0]).attr("cy",p[i][1]).attr("r",6)
       .attr("fill","none").attr("stroke",RWLook.d.cursor).attr("stroke-width",1.5); }
  DIEL_CLOCK.forEach(w=>{ const a=ANG[w];
    svg.append("text").attr("x",cx+(RR+16)*Math.sin(a)).attr("y",cy-(RR+16)*Math.cos(a)+3)
      .attr("text-anchor","middle").attr("fill","var(--dim)").attr("font-size",10).text(w); });
  drawHourFlags(svg, mo);                              // P55: a window worth opening hour by hour
}

// DAY focus: the month's ribbon, every other traced month's ribbon (median dashed in its trace
// colour, band faint), and - when a day is being heard - that day's rose on top, bold.
function drawFocusDay(svg, mo, RR, cx, cy){
  const ys=sameMonthYears(mo);
  ((window.WC&&WC.tracedMonths)?WC.tracedMonths():new Set()).forEach(k=>{
    const o=byKey.get(k); if(!o||o===mo||!isShownMo(o)) return;
    if(ys && ys.others.includes(o)) return;                // drawn below, as one of the years
    drawRibbon(svg, o, RR, cx, cy, WC.traceColor(k)||monthColor(o.month), {bandOpacity:0.1, dash:"5,3", width:1.4, opacity:0.9, gapR:3});
  });
  if(ys){                                                  // the other years: their median day only, no band
    ys.others.forEach(o=>{ const g=svg.append("g").attr("class","wc-year-rose").attr("data-mk",o.key);
      drawRibbon(g, o, RR, cx, cy, monthColor(o.month), {bandOpacity:0, dash:"4,3", width:1.4, opacity:ys.op(o), gapR:2.5}); });
    const node=svg.node(); drawYearKey(svg, ys, mo, node.clientWidth, node.clientHeight);
  }
  const col=monthColor(mo.month);
  drawRibbon(svg, mo, RR, cx, cy, col, {bandOpacity:0.3, width:1.6, gapR:3.5});
  const dr = lastDay && dayRec(mo, lastDay);
  if(dr){
    const p=ptsOf(w=> dr[w]? dr[w][index] : null, RR, cx, cy);
    drawDayRose(svg, dr, p, cx, cy, RWLook.d.cursor, 0.08, 1.8);
    markGaps(svg, p, w=>dr[w] && dr[w][index]!=null, 3.5);
    if(lastWin){ const i=DIEL_CLOCK.indexOf(lastWin);
      svg.append("circle").attr("cx",p[i][0]).attr("cy",p[i][1]).attr("r",6)
         .attr("fill","none").attr("stroke",RWLook.d.cursor).attr("stroke-width",1.5); }
  }
  DIEL_CLOCK.forEach(w=>{ const a=ANG[w];
    svg.append("text").attr("x",cx+(RR+16)*Math.sin(a)).attr("y",cy-(RR+16)*Math.cos(a)+3)
      .attr("text-anchor","middle").attr("fill","var(--dim)").attr("font-size",10).text(w); });
  drawHourFlags(svg, mo);                              // P55
}

// ---- THE HOURS (TASKS P55; Miguel 2026-10-02, after Alice: "it would be really nice to see those roses hourly rather
// than those periods") ----------------------------------------------------------------------------------------------
// The FOCUSED rose can open its month into 24 hours (UTC, the recorder's clock): each spoke the hour's average over the
// month's days, shaded by their middle half (P53's band and rules). The month grid stays at four windows, and the SOUND
// stays with the windows: pressing an hour plays the window it belongs to, at L0 (the month) or L1 (a day). At day
// resolution the calendar's days switch too, each to its own 24 hours (no band: one day). The data is
// data/hourly/<channel>/<month>.json (viz/gen_hourly.py, from the server's hourly tables, checked there against L1),
// fetched beside this page (viz/hourly) when a month opens; index.json carries each month's "worth opening" flags.
let roseHours = (()=>{ try{ return localStorage.getItem("rewild_rose_hours")==="1"; }catch(e){ return false; } })();
let lastHour=null, _hourPress=null, sideTip=null;   // the hour pressed on an hours rose (UTC), handed to focus()/focusDay()
const HOURLY=new Map(), HOURIDX=new Map(), _hourLoading=new Set();
const pad2h = h => String(h).padStart(2,"0");
const hourIndex = () => HOURIDX.get(channel) || null;
const hourMonth = mo => mo ? (HOURLY.get(`${channel}|${mo.key}`) || null) : null;
const hoursOn = mo => roseHours && !!hourMonth(mo) && !hourMonth(mo).failed;
function loadHourIndex(){
  const ch=channel, k="i|"+ch;
  if(HOURIDX.has(ch) || _hourLoading.has(k)) return;
  _hourLoading.add(k);
  fetch(`hourly/${ch}/index.json`).then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{
    _hourLoading.delete(k); HOURIDX.set(ch, j || {failed:true, flags:{}});
    if(ch===channel && lastFocus) focusDraw(lastFocus); });
}
function loadHourMonth(mo){
  if(!mo) return;
  const ch=channel, k=`${ch}|${mo.key}`;
  if(HOURLY.has(k) || _hourLoading.has(k)) return;
  _hourLoading.add(k);
  fetch(`hourly/${ch}/${mo.key}.json`).then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{
    _hourLoading.delete(k); HOURLY.set(k, j || {failed:true});
    if(ch!==channel) return;
    if(lastFocus && lastFocus.key===mo.key) focusDraw(lastFocus);
    if(isDay() && calMonth && calMonth.key===mo.key) drawCalendar(); });
}
// A MONTH'S HOUR, as gen_hourly.py reads it for the flag: the days whose hour is FULL (>= full_min of its 60 minutes
// decoded, findings/12); their average (n_species weighted by the minutes BirdNET analysed, as the roses weight it),
// middle half and median, and how many. null = no full hour that month.
function hourStats(H, key){
  const full=H.full_min||48;
  return d3.range(24).map(h=>{
    const vs=[], ws=[];
    H.days.forEach(d=>{ const a=d.v[key], v=a?a[h]:null; if(v==null || !(d.nm[h]>=full)) return;
      const w = key==="n_species" ? ((d.bn&&d.bn[h])||0) : 1; if(w>0){ vs.push(v); ws.push(w); } });
    if(!vs.length) return null;
    let s=0, sw=0; vs.forEach((v,i)=>{ s+=v*ws[i]; sw+=ws[i]; });
    const so=vs.slice().sort((a,b)=>a-b);
    return { avg:s/sw, lo:quant(so,0.25), med:quant(so,0.5), hi:quant(so,0.75), n:vs.length };
  });
}
// the window an hour belongs to (its centre, diel.js): this month's (its sun, as the hour views' strip) or one day's own
const hourWin = (H, h) => DIEL.at(h, H.sun);
const dayHourWin = (d, h) => DIEL.at(h, {sr:d.sr, ss:d.ss});
const hourDay = (H, dk) => (H && H.days) ? (H.days.find(d=>d.d===+dk.slice(8)) || null) : null;
const HANG = h => (h+0.5)/24*2*Math.PI;           // an hour's spoke: its centre, clockwise from 00 UTC at the top
function hourPts(valFn, RR, cx, cy){
  return d3.range(24).map(h=>{ const r=rad(valFn(h))*RR, a=HANG(h); return [cx + r*Math.sin(a), cy - r*Math.cos(a)]; });
}
function hourAt(node, e){                          // the hour whose sector holds the pointer
  const b=node.getBoundingClientRect();
  const t=Math.atan2(e.clientX-(b.left+b.width/2), (b.top+b.height/2)-e.clientY);
  return ((Math.floor(t/(2*Math.PI)*24)%24)+24)%24;
}
// THE HOURS ROSE: the month's 24 hours (and, at day resolution, the day being heard on top)
function drawFocusHours(svg, mo, H, RR, cx, cy){
  const col=monthColor(mo.month), st=hourStats(H, index), has=h=>!!st[h], thin=h=>!st[h] || st[h].n<THIN_N;
  // the windows THIS month: an arc just outside the rim over each run of hours one window holds (an hour by its centre
  // against the month's sun, as spectro/mfcc's strip), so the 24 hours line up with the four spokes you hear. Thin,
  // in the windows' own colours at full strength (fainter, they fail the style kit's separation check in every look);
  // the window you hear is drawn thicker
  const arc=d3.arc(), ga=svg.append("g").attr("class","hr-wins").attr("transform",`translate(${cx},${cy})`);
  DIEL.runs(d3.range(24), H.sun).forEach(r=>ga.append("path").attr("class","hr-win").attr("data-win",r.win)
    .attr("data-h0",r.h0).attr("data-h1",r.h1)
    .attr("d",arc({innerRadius:RR+2, outerRadius:r.win===lastWin ? RR+6 : RR+4, startAngle:r.h0/24*2*Math.PI, endAngle:r.h1/24*2*Math.PI}))
    .attr("fill",DIEL.COLOR[r.win]));
  // the band: the middle half of the month's days at each hour, a wedge between neighbouring hours; faint where either
  // hour has fewer than THIN_N days (P53's rule); none where one has no full day
  const outer=hourPts(h=>has(h)?st[h].hi:null, RR, cx, cy), inner=hourPts(h=>has(h)?st[h].lo:null, RR, cx, cy);
  const avg=hourPts(h=>has(h)?st[h].avg:null, RR, cx, cy);
  const gb=svg.append("g").attr("class","hr-band");
  d3.range(24).forEach(h=>{ const j=(h+1)%24; if(!has(h)||!has(j)) return;
    gb.append("path").attr("data-h",h).attr("d",`M${outer[h]}L${outer[j]}L${inner[j]}L${inner[h]}Z`)
      .attr("fill",col).attr("fill-opacity",0.3*((thin(h)||thin(j))?THIN_FADE:1)).attr("stroke","none"); });
  // the line: each hour's AVERAGE over the month's days (P53: the average, no fill), joined where both hours have one
  const gl=svg.append("g").attr("class","hr-line");
  d3.range(24).forEach(h=>{ const j=(h+1)%24; if(!has(h)||!has(j)) return;
    gl.append("path").attr("data-h",h).attr("d",`M${avg[h]}L${avg[j]}`).attr("fill","none").attr("stroke",col)
      .attr("stroke-width",2).attr("stroke-linecap","round").attr("opacity",(thin(h)||thin(j))?THIN_FADE:1); });
  // each hour's point. An average beyond the windows' scale (below 0 or above 1) sits at the floor or the rim as an
  // OPEN ring; an hour with no full day that month is hollow at the floor - never drawn as a quiet hour
  d3.range(24).forEach(h=>{
    if(!has(h)){ svg.append("circle").attr("class","hr-gap").attr("data-h",h).attr("cx",avg[h][0]).attr("cy",avg[h][1])
      .attr("r",1.4).attr("fill","var(--bg)").attr("stroke","var(--dim)").attr("stroke-width",0.7); return; }
    const v=st[h].avg, off=v<0||v>1;
    svg.append("circle").attr("class","hr-pt"+(off?" hr-off":"")).attr("data-h",h).attr("cx",avg[h][0]).attr("cy",avg[h][1])
      .attr("r",off?2.8:1.6).attr("fill",off?"none":col).attr("stroke",off?col:"none").attr("stroke-width",1.2)
      .attr("opacity",thin(h)?THIN_FADE:1); });
  // at day resolution, the day being heard: its own 24 hours on top (no band: one day), as the day focus draws its rose
  const dr = isDay() && lastDay ? hourDay(H, lastDay) : null, da = dr ? (dr.v[index]||[]) : null;
  const dp = dr ? hourPts(h=>da[h], RR, cx, cy) : null;
  if(dr) drawDayHours(svg, dr, da, dp, cx, cy, RWLook.d.cursor, 0.08, 1.8, 2.4);
  if(lastHour!=null){ const pt=(dr?dp:avg)[lastHour];          // the hour pressed: where the sound was asked for
    svg.append("circle").attr("class","hr-cursor").attr("cx",pt[0]).attr("cy",pt[1]).attr("r",5.5)
       .attr("fill","none").attr("stroke",RWLook.d.cursor).attr("stroke-width",1.5); }
  [[0,"00 UTC"],[6,"06"],[12,"12"],[18,"18"]].forEach(([h,t])=>{ const a=h/24*2*Math.PI;   // the clock, UTC
    svg.append("text").attr("class","hr-clock").attr("x",cx+(RR+16)*Math.sin(a)).attr("y",cy-(RR+16)*Math.cos(a)+3)
       .attr("text-anchor","middle").attr("fill","var(--dim)").attr("font-size",10).text(t); });
}
// ONE DAY'S 24 HOURS - no band (one day). Faded by each hour's recorded minutes as the calendar's day-windows are (P33:
// under 30 min faded, 5 or fewer fainter); hours without a value are not joined, and are marked hollow (gapR)
function drawDayHours(svg, d, a, p, cx, cy, col, fillOp, width, gapR){
  const fade=h=>minFade(d.nm[h]), has=h=>a[h]!=null;
  const g=svg.append("g").attr("class","hr-dayrose");
  d3.range(24).forEach(h=>{ const j=(h+1)%24; if(!has(h)||!has(j)) return; const k=Math.min(fade(h),fade(j));
    g.append("path").attr("d",`M${cx},${cy}L${p[h]}L${p[j]}Z`).attr("fill",col).attr("fill-opacity",fillOp*k).attr("stroke","none");
    g.append("path").attr("class","hr-day").attr("data-h",h).attr("d",`M${p[h]}L${p[j]}`).attr("fill","none").attr("stroke",col)
      .attr("stroke-width",width).attr("stroke-linecap","round").attr("opacity",k); });
  d3.range(24).forEach(h=>{
    if(has(h)){ if(!has((h+23)%24) && !has((h+1)%24))            // a lone hour: a dot, or it would not show at all
        g.append("circle").attr("class","hr-day-pt").attr("data-h",h).attr("cx",p[h][0]).attr("cy",p[h][1]).attr("r",width)
         .attr("fill",col).attr("opacity",fade(h));
      return; }
    if(gapR) g.append("circle").attr("class","hr-gap").attr("data-h",h).attr("cx",p[h][0]).attr("cy",p[h][1]).attr("r",gapR)
      .attr("fill","var(--bg)").attr("stroke","var(--dim)").attr("stroke-width",0.6); });
}
// the month's median hour, grey: what a calendar day's hours are read against (as its median day is, in four windows)
function drawHourRef(svg, st, RR, cx, cy){
  if(!st) return;
  const p=hourPts(h=>st[h]?st[h].med:null, RR, cx, cy);
  d3.range(24).forEach(h=>{ const j=(h+1)%24; if(!st[h]||!st[j]) return;
    svg.append("path").attr("class","hr-ref").attr("d",`M${p[h]}L${p[j]}`).attr("fill","none").attr("stroke","var(--dim)")
      .attr("stroke-width",0.8).attr("opacity",0.7); });
}
// "WORTH OPENING HOUR BY HOUR": this month's windows whose hours differ more than the times of day do (and more than the
// same hours shuffled within their window, day by day, would: gen_hourly.py's gate). A small, quiet clock beside the
// window's name on the four-window rose, with a hover; from index.json (none while it loads, or where it failed).
const HOUR_FLAG_TEXT="worth opening hour by hour: its hours differ more than the times of day do";
function hourFlags(mo){ const I=hourIndex(), f=(I && I.flags && mo) ? I.flags[mo.key] : null; return (f && f[index]) || []; }
function drawHourFlags(svg, mo){
  const fl=hourFlags(mo); if(!fl.length) return;
  svg.selectAll("text").filter(function(){ return fl.includes(this.textContent); }).each(function(){
    const w=this.textContent, x=+this.getAttribute("x") + this.getComputedTextLength()/2 + 7, y=+this.getAttribute("y") - 3.5;
    const g=svg.append("g").attr("class","hr-flag").attr("data-win",w).attr("transform",`translate(${x},${y})`).style("cursor","help");
    g.append("circle").attr("r",3.8).attr("fill","var(--panel)").attr("stroke","var(--dim)").attr("stroke-width",1);
    g.append("path").attr("d","M0,-2.3V0H1.9").attr("fill","none").attr("stroke","var(--dim)").attr("stroke-width",1)
      .attr("stroke-linecap","round").attr("stroke-linejoin","round");
    g.append("title").text(`${w}: ${HOUR_FLAG_TEXT}`);
    g.on("pointerenter",e=>{ if(sideTip) sideTip.show(e, `<div><b>${w}</b> · ${HOUR_FLAG_TEXT}</div>`); })
     .on("pointerleave",()=>{ if(sideTip) sideTip.hide(); }); });
}
// THE INFORMATION PANEL IN HOURS: what the rose shows (UTC), which hours each window holds this month, and the hour
// pressed - its window and value with its days (or, at day resolution, the day's own value and minutes)
function hoursInfo(host, mo){
  const H=hourMonth(mo), cap=host.append("div").attr("class","k hr-cap").style("font-size","11px").style("margin-top","4px");
  if(!H || H.failed){ cap.text(H ? "the hours of this month could not be loaded" : "loading the hours …"); return; }
  const span={};
  DIEL.runs(d3.range(24), H.sun).forEach(r=>{ (span[r.win]=span[r.win]||[]).push(r); });   // night wraps round midnight
  const wins=DIEL.ORDER.filter(w=>span[w]).map(w=>{ const rs=span[w];
    return `${w} ${pad2h(rs.length>1 ? rs[rs.length-1].h0 : rs[0].h0)}–${pad2h((rs.length>1 ? rs[0].h1 : rs[0].h1)%24)}`; }).join(" · ");
  cap.text(`24 hours, UTC · shaded: the middle half of the month's days at each hour · line: the hour's average (a few `
    + `extreme days can pull it outside the shading) · this month ${wins}`);
  if(lastHour==null) return;
  const h=lastHour, st=hourStats(H, index)[h], dd=(isDay() && lastDay) ? hourDay(H, lastDay) : null;
  let html=`<span class="k">${pad2h(h)}:00–${pad2h((h+1)%24)}:00 UTC · ${dd ? dayHourWin(dd, h) : hourWin(H, h)}</span> `, v;
  if(dd){ v=(dd.v[index]||[])[h]; const n=dd.nm[h];
    html += v==null ? `<span class="v">${n ? "not measured" : "not recorded"}</span>` : `<span class="v">${v.toFixed(2)}</span> <span class="k">${n} min</span>`; }
  else { v=st ? st.avg : null;
    html += !st ? `<span class="v">no full hour this month</span>` : `<span class="v">${v.toFixed(2)}</span> <span class="k">(n=${st.n} days)</span>`; }
  if(v!=null && (v<0 || v>1)) html += ` <span class="k">${v>1 ? "above" : "below"} the windows' scale</span>`;
  host.append("div").attr("class","hr-now").style("margin-top","3px").html(html);
}
// PRESSING AN HOUR plays the window it belongs to - the sound stays with the four windows: this month's window for the
// hour (its sun), or, with a day heard, that day's own; the hour is kept as the cursor's spoke. A drag across hours of
// one window sends nothing new (as a drag within one spoke).
function pressHour(node, e, fresh){
  const mo=lastFocus, H=hourMonth(mo), h=hourAt(node, e);
  if(!fresh && h===lastHour) return;
  const day=(isDay() && lastDay) ? hourDay(H, lastDay) : null, w=day ? dayHourWin(day, h) : hourWin(H, h);
  _hourPress=h;
  if(isDay() && lastDay){ if(fresh) _sentTag=null; focusDay(mo, lastDay, w); }    // focusDay sends only a new window
  else if(fresh || w!==lastWin) focus(mo, w);
  else { lastHour=h; _hourPress=null; focusDraw(mo); }                            // the same window: the cursor moves, no sound
}
// a press on a calendar day means: the spoke's window (four windows), or the hour's own window that day (hours)
function calWin(mo, dk, node, e){
  const H=hoursOn(mo) ? hourMonth(mo) : null;
  if(!H) return winAt(node, e);
  const h=hourAt(node, e), d=hourDay(H, dk); _hourPress=h;
  return d ? dayHourWin(d, h) : hourWin(H, h);
}
function showDayHourTip(e, mo, dk, w, h){
  const H=hourMonth(mo), d=hourDay(H, dk), v=d ? (d.v[index]||[])[h] : null, n=d ? d.nm[h] : 0, st=hourStats(H, index)[h];
  const hw=dayWinFor(dk, w);
  tip.show(e, `<div>${DIEL.dot(monthColor(mo.month))}<b>${dayLabel(dk)}</b> · ${pad2h(h)}:00–${pad2h((h+1)%24)}:00 UTC</div>`
    + `<div class="k">${w}${hw && hw!==w ? ` — the day has none: you hear its ${hw}` : " — the window you hear"}</div>`
    + (v!=null ? `<div><span class="k">${index}</span>${fmtv(v)}${st ? ` <span class="k">month median ${fmtv(st.med)}</span>` : ""}</div>` + glossTip()
               : `<div class="k">${n ? `${index} not measured this hour` : "not recorded this hour"}</div>`)
    + (n ? `<div class="k">${minText(n)}</div>` : "")
    + (window.WC && WC.faultNote ? WC.faultNote(dk) : ""));   // P52
}
// THE SWITCH: 4 windows | 24 hours. It changes the picture only - nothing is sent.
function markHours(){ document.querySelectorAll("#hours-toggle .wbtn").forEach(b=>b.classList.toggle("on", (b.dataset.hours==="1")===roseHours)); }
function setRoseHours(on){
  on=!!on; if(on===roseHours) return;
  roseHours=on; lastHour=null; _hourPress=null;
  try{ localStorage.setItem("rewild_rose_hours", on ? "1" : "0"); }catch(e){}
  markHours();
  if(on){ if(lastFocus) loadHourMonth(lastFocus); if(calMonth && calMonth!==lastFocus) loadHourMonth(calMonth); }

document.querySelectorAll("#hours-toggle .wbtn").forEach(b=>b.addEventListener("click",()=>setRoseHours(b.dataset.hours==="1")));
markHours();

// The TRACED set as a readout. Colours are the ring colours, so a dashed line in the focus
// rose and the month that named it are findable from one another. Traces whose month is
// hidden right now are still listed, greyed — a trace is an annotation on the data, not a
// view state, and it is still there waiting for you to show its month again.
function updateTraces(){
  const el=d3.select("#traces"); el.selectAll("*").remove();
  const mm=[...((window.WC&&WC.tracedMonths)?WC.tracedMonths():[])].filter(k=>byKey.has(k)).sort();
  if(!mm.length) return;
  el.append("span").text("traced ");
  mm.forEach((k,i)=>{ const o=byKey.get(k), on=isShownMo(o);
    el.append("span").style("color",WC.traceColor(k)||monthColor(o.month))
      .style("opacity",on?null:0.45)
      .attr("title",on?null:"traced · hidden by the month filter")
      .text(`${i?" · ":""}${MONTHS[o.month]} '${String(o.year).slice(2)}${on?"":" (hidden)"}`); });
  el.append("span").style("cursor","pointer").style("color","var(--cur)").style("margin-left","8px")
    .text("✕ clear").on("click",()=>WC.clearTraces());
}

// ---- month-mean SC drivers (average the non-null windows) ----
function monthDrv(mo){
  const acc={}, n={};
  DIEL_CLOCK.forEach(w=>{ const c=mo.win[w]; if(!c||!c.drv) return;
    Object.entries(c.drv).forEach(([k,v])=>{ if(v==null) return; acc[k]=(acc[k]||0)+v; n[k]=(n[k]||0)+1; }); });
  const out={}; Object.keys(acc).forEach(k=>out[k]=acc[k]/n[k]); return out;
}

// TRACE-DRAG. The other views stroke over a point field to trace (brush.js); there is no
// 2D field here, so the grid itself is the field and the cells the pointer crosses are the
// sweep. It TRACES, not shows: it is armed by the very controls that mean "trace" everywhere
// else — the sidebar's ◫ "brush to trace" toggle, or a held shift/alt — and shift-press is the
// per-point trace gesture in all six views, so a shift-DRAG that instead changed what was
// visible would make this the one view where those keys mean something different.
// Choosing what to SEE is reachable here too, and is a separate control: the month strip and
// the ↺ all button under VIEW, plus the grid's own Jan…Dec / year labels.
function joinTraceDrag(node, mo, start){
  if(start) traceDrag=new Set();
  traceDrag.add(mo.key); node.classList.add("tracing");
}

// ---- build the grid (rows=years, cols=months) ----
function buildGrid(){
  // the `day` class first: its CSS sizes the grid and stretches the cells, and drawCell measures them below
  document.getElementById("grid-wrap").classList.toggle("day", isDay());
  const grid=d3.select("#grid");
  grid.style("grid-template-columns",`44px repeat(12, 1fr)`)
      // DAY: the grid becomes the many-month overview (B) and gives the pane's rest to the calendar
      // (A). minmax(0,…) because a fresh <svg> is 150 px tall by default, and a plain 1fr row
      // would never shrink below it.
      .style("grid-template-rows", isDay() ? `18px repeat(${years.length}, minmax(0,1fr))` : `18px repeat(${years.length}, 1fr)`)
      .style("height", isDay() ? `${18 + years.length*58}px` : null);
  grid.selectAll("*").remove();
  grid.append("div");                                   // corner
  // THE AXES ARE THE FILTER. This grid's columns are months and its rows are years, so its
  // own labels are the most direct way to say "show me every July" (the view's N4 question)
  // or "show me 2024". They write SHOWN only — a column you light gets roses, never rings.
  for(let m=1;m<=12;m++) grid.append("div").attr("class","hd").text(MONTHS[m])
    .attr("title",`show / hide every ${MONTHS[m]}`)
    .on("click",()=>toggleRun(years.map(y=>`${y}-${String(m).padStart(2,"0")}`)));
  years.forEach(yr=>{
    grid.append("div").attr("class","yl").text(yr)
      .attr("title",`show / hide ${yr}`)
      .on("click",()=>toggleRun(d3.range(1,13).map(m=>`${yr}-${String(m).padStart(2,"0")}`)));
    for(let m=1;m<=12;m++){
      const mo=byKey.get(`${yr}-${String(m).padStart(2,"0")}`);
      const cell=grid.append("div").attr("class","cell"+(mo?"":" empty"));
      const svg=cell.append("svg");
      if(mo){
        cell.style("cursor","crosshair")
            .on("pointerover",function(e){ if(traceDrag){ joinTraceDrag(this,mo); return; }
                 if(window._roseDrag) focus(mo, winAt(this,e)); })   // press-drag only (hover no longer selects)
            .on("pointermove",function(e){ showCellTip(e, mo, winAt(this,e));
                 if(traceDrag||!window._roseDrag) return;
                 const w=winAt(this,e); if(mo!==lastFocus||w!==lastWin) focus(mo,w); })   // a rose is a clock: dragging round one walks its day
            .on("pointerleave",()=>{ if(tip) tip.hide(); })
            .on("pointerdown",function(e){
                 if(WC.brushPref()||e.shiftKey||e.altKey){ traceArmed=WC.brushPref()||e.altKey;
                   joinTraceDrag(this,mo,true); return; }   // tracing, not hearing
                 window._roseDrag=true; focus(mo, winAt(this,e)); })                      // press to hear
            // NO tracing here. A plain press HEARS the month, nothing else: pointerdown has
            // already focused it. Tracing is its own gesture everywhere - shift-press, the
            // brush, or the ◎ button - and routing it through the click as well meant every
            // press while navigating quietly traced whatever you were listening to.
            .on("dblclick",()=>{ location.href=`linear.html?m=${mo.key}`; });   // drill L0->L1
      }
      cell.node().__mo=mo; cell.node().__svg=svg;
    }
  });
  redrawCells();
}
const cellNode = mo => d3.selectAll("#grid .cell").nodes().find(n=>n.__mo===mo);
function redrawCells(){
  const gm=grandMean();
  d3.selectAll("#grid .cell").each(function(){
    // .hidden carries the FILTER (dim + inert). .empty carries "no data here" — two different
    // reasons for a blank cell, kept apart so neither is mistaken for the other.
    this.classList.toggle("hidden", !!this.__mo && !isShownMo(this.__mo));
    drawCell(this.__svg, this.__mo||null, gm);
  });
  // light the axis labels whose whole run is in the filter
  const sh=(window.WC&&WC.shownMonths)?WC.shownMonths():new Set();
  const lit=keys=>{ const k=keys.filter(x=>byKey.has(x)); return k.length>0 && k.every(x=>sh.has(x)); };
  d3.selectAll("#grid .hd").classed("sel",function(d,i){
    const m=i+1; return lit(years.map(y=>`${y}-${String(m).padStart(2,"0")}`)); });
  d3.selectAll("#grid .yl").classed("sel",function(){
    const yr=+this.textContent; return lit(d3.range(1,13).map(m=>`${yr}-${String(m).padStart(2,"0")}`)); });
}
// a whole column (every July) or a whole row (all of 2024), in ONE write: if the run is
// already in the filter, drop it; otherwise add it. Membership is read off the RAW filter,
// not isShownMonth — with an empty filter everything is visible, and the useful answer to
// clicking "Jul" there is "now show me only the Julys".
function toggleRun(keys){
  if(!window.WC) return;
  const run=keys.filter(k=>byKey.has(k)); if(!run.length) return;
  const sh=WC.shownMonths();
  WC.setShown(run, run.every(k=>sh.has(k)) ? "remove" : "add");
}
// moving the cursor repaints two roses, not thirty-six — a press-drag calls this on every
// pointermove, and redrawCells() redraws the whole grid
function redrawCursor(a, b){
  const gm=grandMean();
  [a,b].forEach(mo=>{ const n=mo&&cellNode(mo); if(n) drawCell(n.__svg, mo, gm); });
}
// the grid scrolls once there are more years than fit, so a month sent here from elsewhere
// (the legend catalogue) has to be scrolled to before "see it" means anything
function revealCell(mo){
  const n=cellNode(mo);
  if(n&&n.scrollIntoView) n.scrollIntoView({block:"nearest",inline:"nearest"});
}
// MAKE A MONTH VISIBLE, without narrowing the view by accident. An empty filter already shows
// everything, so adding to it there would go from "all 36 months" to "this one" — the opposite
// of what a legend chip means. Only a filter that is actually excluding the month is widened.
function reveal(key){
  if(!window.WC) return;
  const mk=WC.monthOf(key); if(!mk || WC.isShownMonth(mk)) return;
  WC.setShown([mk],"add");
}
// THE CURSOR CANNOT STAND ON A MONTH THAT IS NOT THERE. Hide the month you were hearing and
// the focus panel goes back to its empty state: nothing is re-voiced, nothing is played, the
// sound simply has no point under it until you press one that is on screen.
function syncFocus(){
  if(!lastFocus || isShownMo(lastFocus)) return;
  clearFocus();
}
function clearFocus(){
  lastFocus=null; lastWin=null; lastDay=null;
  d3.select("#focus-title").text("PRESS A MONTH");
  d3.select("#focus").selectAll("*").remove();
  d3.select("#f-info").selectAll("*").remove();
  d3.select("#r-ret").text("");

// ---- the month strip: the SHOWN filter, spelled the way the other five views spell it ----
function mountMonthBar(){
  if(!_mbar) _mbar=MonthBar.mount({ host:"#monthbar", months:()=>roses.map(r=>r.key).sort(),
    current:()=>lastFocus&&lastFocus.key,
    // a MULTI-month view: picking only changes what is on screen. It does not move the cursor
    // and does not sound anything, so MonthBar.pick's return value is not used here.
    onPick:mk=>{ MonthBar.pick(mk, lastFocus&&lastFocus.key); } });
