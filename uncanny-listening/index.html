<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uncanny Listening</title>
<meta name="description" content="Human-algorithmic listening: song folders analysed in the browser, nothing uploaded.">
<link rel="stylesheet" href="darkstyle/darkstyle.css">
<script src="darkstyle/darkstyle.js"></script>
<script src="vendor/d3.v7.min.js"></script>
<link rel="stylesheet" href="app/app.css">
</head>
<!-- The layout follows Dark Re-wilding's grammar (its view/panel.js and view/legend.js), with Miguel's two-sided split
     (2026-10-28): on the LEFT one panel, two tabs — SETUP (① classes ② features ③ training, in pipeline order) · LEGEND (the
     perceptual legend); in the middle the workspace; on the RIGHT the controls: a pinned INFORMATION readout over five tabs
     VIEW · LENS · SOUND · TRACE · OUTPUT (hide · i); the Live panel, its own, on the far right. -->
<body>
<header id="top">
  <span class="brand">uncanny listening</span>
  <a class="info-i" href="about.html" data-i18n-title="about" aria-label="about">ⓘ</a>
  <span class="k" id="count"></span>
  <span id="chip"><span id="chiptext"></span></span>
  <span class="grow"></span>
  <button class="btn sm" id="open2" data-i18n="setup_open"></button>
  <button class="btn sm" id="livebtn" data-i18n="live" aria-expanded="false"></button>
</header>
<main id="app">
  <aside id="left" hidden>
    <nav id="ltabs">
      <button class="stab" data-ltab="setup" data-i18n="tab_setup"></button>
      <button class="stab" data-ltab="legend" data-i18n="legend_tab"></button>
      <button class="btn sm" id="leftclose" aria-label="close">×</button>
    </nav>
    <section id="setup" data-lpane="setup">
      <h4 class="step"><span>①</span> <span data-i18n="classes"></span></h4>
      <div id="classes"></div>
      <div class="row"><button class="btn sm" id="addclass" data-i18n="add_class"></button><button class="btn sm" id="openall" data-i18n="open_all"></button></div>
      <p class="k small" data-i18n="rename_note"></p>
      <p class="k small" id="need2" data-i18n="need2" hidden></p>
      <div class="row"><button class="btn sm" id="o_stload" data-i18n="o_stload"></button></div>
      <p class="k small" data-i18n="st_open_how"></p>
      <h4 class="step"><span>②</span> <span data-i18n="features_h"></span></h4>
      <div id="features" class="small"></div>
      <div class="k small" data-i18n="formats"></div>
      <div class="seg wide" id="formats"><button class="btn sm" data-f="preset"></button><button class="btn sm" data-f="all"></button></div>
      <p class="k small" data-i18n="extras_note"></p>
      <div class="row"><button class="btn" id="analyse" data-i18n="analyse"></button><button class="btn" id="cancel" data-i18n="cancel" hidden></button></div>
      <div id="est" class="k small"></div>
      <div id="bar"><i></i></div>
      <div id="status" class="k small"></div>
      <div id="result"></div>
      <div id="errors" class="k"></div>
      <div id="source"></div>
      <h4 class="step"><span>③</span> <span data-i18n="training_h"></span></h4>
      <p class="k small" data-i18n="training_how"></p>
      <div id="trainknobs"></div>
      <div id="processing" class="small"></div>
    </section>
    <section id="leg" data-lpane="legend"></section>
  </aside>
  <button id="legtab" class="edgetab" data-i18n-title="left_how"><span data-i18n="left_tab"></span> · L</button>
  <div id="workcol">
  <section id="work">
    <div id="empty" class="empty">
      <h1 data-i18n="empty_h"></h1>
      <p data-i18n="empty_p"></p>
      <button class="btn big" id="open" data-i18n="open"></button>
    </div>
    <div id="maps"></div>
    <div id="timeline" hidden></div>
    <div id="compare" hidden></div>
    <div id="pairs" hidden></div>
    <div id="tip" hidden></div>
  </section>
  <div id="mapkey" hidden></div>
  </div>
  <aside id="side">
    <button id="sidetab" class="edgetab" data-i18n-title="hide_how"><span data-i18n="hide_tab"></span> · i</button>
    <section class="sec" id="infosec">
      <div class="sec-h" id="infoh"><span data-i18n="info_h"></span><span class="sec-chev">▾</span></div>
      <div class="sec-b" id="info"></div>
    </section>
    <nav id="tabs">
      <button class="stab" data-tab="view" data-i18n="tab_view"></button>
      <button class="stab" data-tab="lens" data-i18n="tab_lens"></button>
      <button class="stab" data-tab="sound" data-i18n="tab_sound"></button>
      <button class="stab" data-tab="trace" data-i18n="tab_trace"></button>
      <button class="stab" data-tab="output" data-i18n="tab_output"></button>
    </nav>
    <section class="pane" data-pane="view">
      <div class="grid2" id="views"><button class="btn sm" data-v="maps" data-i18n="v_maps"></button><button class="btn sm" data-v="timeline" data-i18n="v_timeline"></button><button class="btn sm" data-v="compare" data-i18n="v_compare"></button><button class="btn sm" data-v="pairs" data-i18n="v_pairs"></button></div>
      <div id="viewopts"></div>
      <div id="mapopts">
        <h4 data-i18n="maps"></h4>
        <div class="seg wide" id="mapset"><button class="btn sm" data-m="mean" data-i18n="maps_mean"></button><button class="btn sm" data-m="std" data-i18n="maps_std"></button></div>
      </div>
      <h4 data-i18n="colour"></h4>
      <div class="grid2" id="colourby"><button class="btn sm" data-c="class" data-i18n="c_class"></button><button class="btn sm" data-c="km" data-i18n="c_km"></button><button class="btn sm" data-c="model" data-i18n="c_model"></button><button class="btn sm" data-c="agree" data-i18n="c_agree"></button></div>
      <div class="seg wide"><button class="btn sm" id="bound"></button></div>
      <h4 data-i18n="look_h"></h4>
      <div id="looks"></div>
      <h4 data-i18n="lang_h"></h4>
      <div class="seg wide"><button class="btn sm" data-lang="en">English</button><button class="btn sm" data-lang="es">Español</button></div>
    </section>
    <section class="pane" data-pane="lens">
      <h4 data-i18n="knobs"></h4>
      <p class="k small" data-i18n="knobs_how"></p>
      <div id="knobs"></div>
      <div id="modelout"></div>
    </section>
    <section class="pane" data-pane="sound">
      <h4 data-i18n="volume"></h4>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
      <div id="pairsound"></div>
      <div id="walkout"></div>
      <h4 data-i18n="live_h"></h4>
      <div class="row"><span id="livelight2" class="light"></span><span id="livestate2" class="k"></span><span class="grow"></span><button class="btn sm" id="liveopen" data-i18n="live_panel"></button></div>
      <p class="k small" data-i18n="sound_note"></p>
    </section>
    <section class="pane" data-pane="trace">
      <h4 data-i18n="selection"></h4>
      <div class="row"><span id="selinfo" class="k"></span><span class="grow"></span><button class="btn sm" id="selclear" data-i18n="clear"></button></div>
      <h4 data-i18n="trace"></h4>
      <div class="k small" data-i18n="trace_how"></div>
      <ol id="tracelist"></ol>
      <div class="row"><button class="btn sm" id="traceclear" data-i18n="clear"></button></div>
      <div id="listout"></div>
      <div id="edits" hidden></div>
    </section>
    <section class="pane" data-pane="output">
      <h4 data-i18n="out_session"></h4>
      <div class="grid2"><button class="btn sm" id="o_save" data-i18n="o_save"></button><button class="btn sm" id="o_open" data-i18n="o_open"></button></div>
      <div class="seg wide"><button class="btn sm" id="o_link" data-i18n="o_link"></button></div>
      <div id="linknote" class="k small"></div>
      <h4 data-i18n="st_h"></h4>
      <div class="seg wide"><button class="btn sm" id="o_stsave" data-i18n="o_stsave"></button></div>
      <p class="k small" data-i18n="st_save_how"></p>
      <h4 data-i18n="out_tables"></h4>
      <div class="seg wide"><button class="btn sm" id="o_csv" data-i18n="o_csv"></button></div>
      <h4 data-i18n="out_figures"></h4>
      <div class="grid2"><button class="btn sm" id="o_svg" data-i18n="o_svg"></button><button class="btn sm" id="o_png" data-i18n="o_png"></button></div>
      <p class="k small" data-i18n="out_fig_note"></p>
      <h4 data-i18n="o_note"></h4>
      <div class="seg wide"><button class="btn sm" id="o_note" data-i18n="o_note"></button></div>
    </section>
  </aside>
  <aside id="live" hidden>
    <div class="row"><h4 data-i18n="live_h"></h4><span class="grow"></span><button class="btn sm" id="liveclose">×</button></div>
    <p class="k small" data-i18n="live_what"></p>
    <div class="row"><span id="livelight" class="light"></span><span id="livestate"></span></div>
    <div class="seg wide"><button class="btn sm" id="liveon"></button></div>
    <div class="kv2"><span class="k" data-i18n="live_port"></span><input id="liveport" type="number" min="1024" max="65535" value="9002">
      <span class="k" data-i18n="live_rate"></span><input id="liverate" type="number" min="1" max="60" value="20"></div>
    <div class="seg wide"><button class="btn sm" id="livefollow"></button></div>
    <div class="seg wide"><button class="btn sm" id="liveplays"></button></div>
    <div class="kv2"><span class="k" data-i18n="live_focus"></span><select id="livefocus"></select></div>
    <div id="liveinfo" class="k small"></div>
    <p class="k small" data-i18n="live_how"></p>
  </aside>
</main>
<input type="file" id="pick" webkitdirectory multiple hidden>
<input type="file" id="pickclass" webkitdirectory multiple hidden>
<input type="file" id="linkpick" webkitdirectory multiple hidden>
<input type="file" id="stagepick" accept=".csv,.parquet" multiple hidden>
<dialog id="notebox"><div class="row"><b data-i18n="o_note"></b><span class="grow"></span><span class="seg"><button class="btn sm" data-nl="en">EN</button><button class="btn sm" data-nl="es">ES</button></span></div>
  <textarea id="notetext" readonly></textarea>
  <div class="row"><button class="btn sm" id="notecopy" data-i18n="copy"></button><button class="btn sm" id="notedl" data-i18n="o_note_dl"></button><span class="grow"></span><button class="btn sm" id="noteclose" data-i18n="close"></button></div></dialog>
<script type="module" src="app/main.js"></script>
</body>
</html>
